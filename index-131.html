<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0"/>
<title>WatchEarn</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#0A0A0F;font-family:Arial,sans-serif;color:#F0F0F0;font-size:14px}
.btn{cursor:pointer;border:none;font-family:Arial,sans-serif;font-weight:700;transition:opacity .2s}
.btn:active{opacity:.8}
input{outline:none;font-family:Arial,sans-serif;-webkit-appearance:none}
#app{max-width:420px;margin:0 auto;min-height:100vh}
</style>
</head>
<body>
<div id="app"><div style="display:flex;align-items:center;justify-content:center;min-height:100vh;color:#00E5A0;font-size:18px">Chargement...</div></div>
<script>
var API = "https://watchearn-backend.onrender.com";
var S = {
  user: null, token: null, screen: "home",
  currentAd: null, isUnlock: false, progress: 0, timeLeft: 0,
  history: [], watched: {}, phase: "watch", unlockW: 0,
  totalViews: 0, totalEarned: 0, earned: null,
  wEmail: "", wDone: false, wLoad: false, wErr: "",
  timerInterval: null,
  authMode: "login", authName: "", authEmail: "", authPass: "",
  authErr: "", authLoad: false
};

// Init from storage
try {
  var tk = localStorage.getItem("we_token");
  var u  = localStorage.getItem("we_user");
  var w  = localStorage.getItem("we_watched");
  var p  = localStorage.getItem("we_phase");
  var uw = localStorage.getItem("we_unlock_w");
  if (tk && u) { S.token = tk; S.user = JSON.parse(u); S.totalViews = S.user.total_views||0; S.totalEarned = S.user.total_earned||0; }
  if (w)  S.watched  = JSON.parse(w);
  if (p)  S.phase    = p;
  if (uw) S.unlockW  = parseInt(uw)||0;
} catch(e) {}

var ADS = [
  {id:"1",brand:"Nike",title:"Just Do It 2026",reward:0.13,duration:30,color:"#FF4500",emoji:"👟"},
  {id:"2",brand:"Spotify",title:"Musique Sans Limite",reward:0.08,duration:20,color:"#1DB954",emoji:"🎵"},
  {id:"3",brand:"Amazon",title:"Deals du Jour",reward:0.18,duration:35,color:"#FF9900",emoji:"📦"},
  {id:"4",brand:"Netflix",title:"Ce Soir Sur Netflix",reward:0.10,duration:25,color:"#E50914",emoji:"🎬"},
  {id:"5",brand:"Apple",title:"iPhone 17 Pro",reward:0.23,duration:40,color:"#A8A8A8",emoji:"📱"},
  {id:"6",brand:"Adidas",title:"Impossible Is Nothing",reward:0.08,duration:30,color:"#444",emoji:"⚽"}
];
var UNLOCK_ADS = [
  {id:"u1",brand:"McDonald's",title:"I'm Lovin' It",duration:20,color:"#FFC300",emoji:"🍔"},
  {id:"u2",brand:"Samsung",title:"Galaxy S26",duration:25,color:"#1428A0",emoji:"📲"}
];

function medal(v) {
  if (v >= 500) return {icon:"🥇",label:"Or",color:"#FFD700",next:"Max!"};
  if (v >= 100) return {icon:"🥈",label:"Silver",color:"#C0C0C0",next:(500-v)+" vues pour Or"};
  return {icon:"🥉",label:"Bronze",color:"#CD7F32",next:(100-v)+" vues pour Silver"};
}

function apiCall(method, path, body, token, onSuccess, onError) {
  var xhr = new XMLHttpRequest();
  xhr.open(method, API + path, true);
  xhr.setRequestHeader("Content-Type", "application/json");
  if (token) xhr.setRequestHeader("Authorization", "Bearer " + token);
  xhr.onreadystatechange = function() {
    if (xhr.readyState !== 4) return;
    try {
      var d = JSON.parse(xhr.responseText);
      if (xhr.status >= 200 && xhr.status < 300) { onSuccess(d); }
      else { onError(d.error || "Erreur serveur"); }
    } catch(e) { onError("Erreur connexion"); }
  };
  xhr.onerror = function() { onError("Pas de connexion"); };
  xhr.send(body ? JSON.stringify(body) : null);
}

function render() {
  document.getElementById("app").innerHTML = buildApp();
}

window.admobRewardEarned = function() {
  if (S.currentAd) { clearInterval(S.timerInterval); finishAd(S.currentAd, S.isUnlock); }
};

// ─── AUTH ─────────────────────────────────────────────────────────────────
function doAuth() {
  if (!S.authEmail || !S.authPass || (S.authMode === "register" && !S.authName)) {
    S.authErr = "Remplissez tous les champs"; render(); return;
  }
  S.authErr = ""; S.authLoad = true; render();
  var path = S.authMode === "login" ? "/auth/login" : "/auth/register";
  var body = S.authMode === "login"
    ? {email: S.authEmail, password: S.authPass}
    : {email: S.authEmail, password: S.authPass, name: S.authName};
  apiCall("POST", path, body, null, function(d) {
    try { localStorage.setItem("we_token", d.token); localStorage.setItem("we_user", JSON.stringify(d.user)); } catch(e) {}
    S.token = d.token; S.user = d.user;
    S.totalViews = d.user.total_views || 0; S.totalEarned = d.user.total_earned || 0;
    S.authLoad = false; render();
    loadHist(); refreshMe();
  }, function(err) { S.authErr = err; S.authLoad = false; render(); });
}

function logout() {
  try { localStorage.removeItem("we_token"); localStorage.removeItem("we_user"); } catch(e) {}
  S.user = null; S.token = null; S.history = []; render();
}

function loadHist() {
  apiCall("GET", "/me/history", null, S.token, function(d) {
    S.history = d.slice(0, 10); render();
  }, function() {});
}

function refreshMe() {
  apiCall("GET", "/me", null, S.token, function(d) {
    S.user = d; S.totalViews = d.total_views||0; S.totalEarned = d.total_earned||0;
    try { localStorage.setItem("we_user", JSON.stringify(d)); } catch(e) {}
    render();
  }, function() {});
}

// ─── ADS ──────────────────────────────────────────────────────────────────
function startAd(adId, unlock) {
  var ad = null;
  var all = ADS.concat(UNLOCK_ADS);
  for (var i = 0; i < all.length; i++) { if (all[i].id === adId) { ad = all[i]; break; } }
  if (!ad) return;
  clearInterval(S.timerInterval);
  S.currentAd = ad; S.isUnlock = unlock; S.screen = "watching"; S.progress = 0; S.timeLeft = ad.duration;
  render();
  console.log("action=show_ad");
  var dur = ad.duration;
  S.timerInterval = setInterval(function() {
    S.timeLeft = Math.max(0, S.timeLeft - 1);
    S.progress += 100 / dur;
    if (S.progress >= 100) {
      clearInterval(S.timerInterval); S.progress = 100;
      finishAd(ad, unlock); return;
    }
    var pb = document.getElementById("pb");
    var tl = document.getElementById("tl");
    if (pb) pb.style.width = Math.min(S.progress, 100) + "%";
    if (tl) tl.textContent = S.timeLeft + "s";
  }, 1000);
}

function finishAd(ad, unlock) {
  clearInterval(S.timerInterval);
  if (unlock) {
    var nu = S.unlockW + 1;
    S.unlockW = nu;
    try { localStorage.setItem("we_unlock_w", nu); } catch(e) {}
    if (nu >= 2) {
      S.watched = {}; S.phase = "watch"; S.unlockW = 0; S.earned = null;
      try { localStorage.setItem("we_watched", "{}"); localStorage.setItem("we_phase", "watch"); localStorage.setItem("we_unlock_w", "0"); } catch(e) {}
      S.screen = "unlocked";
    } else {
      S.earned = null; S.screen = "success";
    }
    render(); return;
  }
  apiCall("POST", "/ads/" + ad.id + "/complete", {}, S.token, function(d) {
    S.user = {balance: d.new_balance || ((S.user.balance||0) + ad.reward), total_views: d.total_views||S.totalViews+1, total_earned: d.total_earned||S.totalEarned+ad.reward, name: S.user.name};
    S.totalViews = S.user.total_views; S.totalEarned = S.user.total_earned;
    try { localStorage.setItem("we_user", JSON.stringify(S.user)); } catch(e) {}
    S.history.unshift({ad_id: ad.id, reward: d.reward||ad.reward, created_at: new Date()});
    S.earned = d.reward || ad.reward;
    saveWatched(ad);
  }, function() {
    S.user = Object.assign({}, S.user, {balance: ((S.user.balance||0) + ad.reward)});
    S.totalViews += 1; S.totalEarned = +(S.totalEarned + ad.reward).toFixed(2);
    S.earned = ad.reward;
    saveWatched(ad);
  });
}

function saveWatched(ad) {
  S.watched[ad.id] = true;
  try { localStorage.setItem("we_watched", JSON.stringify(S.watched)); } catch(e) {}
  if (Object.keys(S.watched).length >= ADS.length) {
    S.phase = "unlock";
    try { localStorage.setItem("we_phase", "unlock"); } catch(e) {}
  }
  S.screen = "success"; render();
}

function doWithdraw() {
  if (!S.wEmail || !S.user || (S.user.balance||0) < 10) return;
  S.wLoad = true; S.wErr = ""; render();
  apiCall("POST", "/withdraw", {paypal_email: S.wEmail}, S.token, function() {
    S.user = Object.assign({}, S.user, {balance: 0});
    try { localStorage.setItem("we_user", JSON.stringify(S.user)); } catch(e) {}
    S.wDone = true; S.wLoad = false; render();
  }, function(err) { S.wErr = err; S.wLoad = false; render(); });
}

function setInput(key, val) { S[key] = val; }

// ─── BUILD ────────────────────────────────────────────────────────────────
function h(tag, attrs, content) {
  var a = "";
  for (var k in attrs) { if (attrs[k] !== null && attrs[k] !== undefined) a += " " + k + '="' + attrs[k] + '"'; }
  return "<" + tag + a + ">" + (content||"") + "</" + tag + ">";
}

function buildApp() {
  if (!S.user) return buildAuth();
  var bal = S.user.balance || 0;
  var m = medal(S.totalViews);
  if (S.screen === "watching") return buildWatching();
  if (S.screen === "success")  return buildSuccess(bal);
  if (S.screen === "unlocked") return buildUnlocked();
  if (S.screen === "withdraw") return buildWithdraw(bal);
  return buildHome(bal, m);
}

function buildAuth() {
  return '<div style="min-height:100vh;background:#0A0A0F;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px">'
  + '<div style="display:flex;align-items:center;gap:12px;margin-bottom:32px">'
  + '<div style="width:44px;height:44px;border-radius:12px;background:linear-gradient(135deg,#00E5A0,#00B4D8);display:flex;align-items:center;justify-content:center;font-size:20px;color:#000;font-weight:900">▶</div>'
  + '<span style="font-size:24px;font-weight:800;color:#fff">WatchEarn</span></div>'
  + '<div style="width:100%;max-width:360px;background:#111120;border:1px solid #1A1A2A;border-radius:20px;padding:24px">'
  + '<div style="font-size:20px;font-weight:800;color:#fff;margin-bottom:4px">' + (S.authMode==="login"?"Connexion":"Créer un compte") + '</div>'
  + '<div style="font-size:12px;color:#ffffff50;margin-bottom:20px">' + (S.authMode==="login"?"Accédez à votre solde":"Commencez à gagner") + '</div>'
  + (S.authMode==="register" ? '<div style="margin-bottom:12px"><div style="font-size:11px;color:#ffffff60;margin-bottom:5px">Prénom</div>'
    + '<input type="text" placeholder="Jonathan" value="' + (S.authName||"") + '" oninput="S.authName=this.value" style="width:100%;background:#0A0A0F;border:1px solid #2A2A3A;border-radius:10px;padding:12px;color:#fff;font-size:14px"/></div>' : "")
  + '<div style="margin-bottom:12px"><div style="font-size:11px;color:#ffffff60;margin-bottom:5px">Email</div>'
  + '<input type="email" placeholder="vous@example.com" value="' + (S.authEmail||"") + '" oninput="S.authEmail=this.value" style="width:100%;background:#0A0A0F;border:1px solid #2A2A3A;border-radius:10px;padding:12px;color:#fff;font-size:14px"/></div>'
  + '<div style="margin-bottom:18px"><div style="font-size:11px;color:#ffffff60;margin-bottom:5px">Mot de passe</div>'
  + '<input type="password" placeholder="••••••••" value="' + (S.authPass||"") + '" oninput="S.authPass=this.value" style="width:100%;background:#0A0A0F;border:1px solid #2A2A3A;border-radius:10px;padding:12px;color:#fff;font-size:14px"/></div>'
  + (S.authErr ? '<div style="background:#FF450015;border:1px solid #FF450040;border-radius:8px;padding:9px;font-size:12px;color:#FF9060;margin-bottom:12px">⚠️ ' + S.authErr + '</div>' : "")
  + '<button class="btn" onclick="doAuth()" style="width:100%;background:linear-gradient(135deg,#00E5A0,#00B4D8);color:#000;border-radius:10px;padding:13px;font-size:14px">'
  + (S.authLoad ? "Chargement..." : (S.authMode==="login"?"Se connecter →":"Créer mon compte →")) + '</button>'
  + '<div style="text-align:center;margin-top:14px;font-size:12px;color:#ffffff40">'
  + (S.authMode==="login"?"Pas encore de compte ? ":"Déjà un compte ? ")
  + '<span onclick="S.authMode=S.authMode===\'login\'?\'register\':\'login\';S.authErr=\'\';render()" style="color:#00E5A0;cursor:pointer;font-weight:600">'
  + (S.authMode==="login"?"S\'inscrire":"Se connecter") + '</span></div></div></div>';
}

function buildHome(bal, m) {
  var wc = Object.keys(S.watched).length;
  var html = '<div style="background:#0A0A0F;min-height:100vh;padding-bottom:80px">';
  // Header
  html += '<div style="padding:14px 18px;border-bottom:1px solid #1A1A2A;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;background:#0A0A0F;z-index:10">'
  + '<div style="display:flex;align-items:center;gap:10px">'
  + '<div style="width:30px;height:30px;border-radius:8px;background:linear-gradient(135deg,#00E5A0,#00B4D8);display:flex;align-items:center;justify-content:center;font-size:14px;color:#000;font-weight:900">▶</div>'
  + '<div><div style="font-size:14px;font-weight:800">WatchEarn</div><div style="font-size:10px;color:#ffffff40">Bonjour ' + (S.user.name||"") + ' 👋</div></div></div>'
  + '<div style="display:flex;gap:6px;align-items:center">'
  + '<div style="background:#111120;border:1px solid #00E5A030;border-radius:8px;padding:5px 10px"><span style="color:#00E5A0;font-weight:700">💰 ' + bal.toFixed(2) + ' €</span></div>'
  + '<button class="btn" onclick="logout()" style="background:#1A1A2A;border:none;border-radius:8px;padding:5px 9px;color:#ffffff50;font-size:13px">⎋</button>'
  + '</div></div>';
  // Balance
  html += '<div style="padding:14px 18px 0">'
  + '<div style="background:#111120;border:1px solid #00E5A025;border-radius:18px;padding:18px;margin-bottom:8px">'
  + '<div style="font-size:11px;color:#ffffff50;margin-bottom:4px">SOLDE DISPONIBLE</div>'
  + '<div style="font-size:36px;font-weight:800;color:#00E5A0;margin-bottom:12px">' + bal.toFixed(2) + ' €</div>'
  + '<button class="btn" onclick="S.screen=\'withdraw\';S.wDone=false;S.wErr=\'\';render()" style="background:' + (bal>=10?"linear-gradient(135deg,#00E5A0,#00B4D8)":"#1A1A2A") + ';color:' + (bal>=10?"#000":"#ffffff40") + ';border-radius:8px;padding:8px 16px;font-size:12px">'
  + (bal>=10?"💸 Retirer via PayPal":"🔒 Encore " + (10-bal).toFixed(2) + "€ pour retirer") + '</button></div>';
  // Stats
  html += '<div style="display:flex;gap:6px;margin-bottom:12px">';
  var stats = [{icon:"👁",val:S.totalViews,label:"Pubs vues",color:null},{icon:"📈",val:S.totalEarned.toFixed(2)+"€",label:"Total gagné",color:null},{icon:m.icon,val:m.label,label:m.next,color:m.color}];
  for (var i = 0; i < stats.length; i++) {
    var s = stats[i];
    html += '<div style="flex:1;background:#111120;border:1px solid ' + (s.color?s.color+"30":"#1A1A2A") + ';border-radius:10px;padding:8px 4px;text-align:center">'
    + '<div style="font-size:18px">' + s.icon + '</div>'
    + '<div style="font-size:12px;font-weight:700;color:' + (s.color||"#fff") + '">' + s.val + '</div>'
    + '<div style="font-size:9px;color:' + (s.color||"#ffffff40") + ';margin-top:1px">' + s.label + '</div></div>';
  }
  html += '</div>';
  // Progress
  var progPct = S.phase==="unlock" ? (S.unlockW/2*100) : (wc/ADS.length*100);
  html += '<div style="background:#111120;border:1px solid #1A1A2A;border-radius:12px;padding:10px 13px;margin-bottom:12px">'
  + '<div style="display:flex;justify-content:space-between;margin-bottom:6px">'
  + '<div style="font-size:12px;font-weight:700">' + (S.phase==="unlock"?"🔒 Débloquer cycle":"📺 Cycle en cours") + '</div>'
  + '<div style="font-size:11px;color:#00E5A0">' + (S.phase==="unlock"?S.unlockW+"/2 vidéos":wc+"/6 pubs") + '</div></div>'
  + '<div style="height:4px;background:#1A1A2A;border-radius:99px;overflow:hidden">'
  + '<div style="height:100%;border-radius:99px;width:' + progPct + '%;background:' + (S.phase==="unlock"?"#FF9900":"#00E5A0") + '"></div></div></div>';
  html += '</div>';
  // Ads
  html += S.phase === "watch" ? buildAdsList() : buildUnlockList();
  // History
  if (S.history.length > 0) {
    html += '<div style="padding:0 18px"><div style="font-size:13px;font-weight:700;margin-bottom:8px">📋 Historique</div>';
    for (var j = 0; j < Math.min(S.history.length, 5); j++) {
      var hitem = S.history[j];
      html += '<div style="display:flex;align-items:center;justify-content:space-between;padding:9px 12px;background:#111120;border:1px solid #1A1A2A;border-radius:10px;margin-bottom:6px">'
      + '<div style="font-size:12px;font-weight:600">Pub regardée</div>'
      + '<div style="font-size:13px;font-weight:700;color:#00E5A0">+' + (hitem.reward||0).toFixed(2) + ' €</div></div>';
    }
    html += '</div>';
  }
  // Bottom nav
  html += '<div style="position:fixed;bottom:0;left:0;right:0;max-width:420px;margin:0 auto;background:#0A0A0F;border-top:1px solid #1A1A2A;padding:10px 20px;display:flex;justify-content:space-around;z-index:20">'
  + '<button class="nav-btn" style="background:none;border:none;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer"><span style="font-size:20px">🏠</span><span style="font-size:9px;color:#00E5A0">Accueil</span></button>'
  + '<button class="nav-btn" onclick="S.screen=\'withdraw\';S.wDone=false;S.wErr=\'\';render()" style="background:none;border:none;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer"><span style="font-size:20px">💸</span><span style="font-size:9px;color:#ffffff50">Retirer</span></button>'
  + '</div>';
  html += '</div>';
  return html;
}

function buildAdsList() {
  var wc = Object.keys(S.watched).length;
  var html = '<div style="padding:0 18px"><div style="font-size:13px;font-weight:700;margin-bottom:10px;display:flex;align-items:center;gap:8px">Pubs disponibles <span style="background:#00E5A020;color:#00E5A0;font-size:10px;border-radius:99px;padding:2px 8px">' + (ADS.length-wc) + ' restantes</span></div>';
  for (var i = 0; i < ADS.length; i++) {
    var ad = ADS[i]; var isW = S.watched[ad.id];
    html += '<div style="background:#111120;border:1px solid ' + (isW?"#00E5A030":"#1A1A2A") + ';border-radius:14px;padding:12px;display:flex;align-items:center;gap:10px;margin-bottom:8px;opacity:' + (isW?0.6:1) + '">'
    + '<div style="width:44px;height:44px;border-radius:10px;background:' + ad.color + '20;border:1px solid ' + ad.color + '40;display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0">' + (isW?"✅":ad.emoji) + '</div>'
    + '<div style="flex:1"><div style="font-size:13px;font-weight:700">' + ad.brand + '</div>'
    + '<div style="font-size:11px;color:#ffffff50">' + ad.title + '</div>'
    + '<div style="font-size:9px;color:#ffffff40;margin-top:3px">⏱ ' + ad.duration + 's</div></div>'
    + '<div style="text-align:right;flex-shrink:0"><div style="font-size:14px;font-weight:800;color:' + (isW?"#ffffff30":"#00E5A0") + '">+' + ad.reward.toFixed(2) + '€</div>'
    + (isW ? '<div style="margin-top:4px;background:#00E5A020;border-radius:6px;padding:4px 10px;font-size:11px;color:#00E5A0">✅ Vu</div>'
           : '<button class="btn" onclick="startAd(\'' + ad.id + '\',false)" style="margin-top:4px;background:' + ad.color + ';color:#fff;border-radius:6px;padding:4px 10px;font-size:11px">▶ Voir</button>')
    + '</div></div>';
  }
  html += '</div>';
  return html;
}

function buildUnlockList() {
  var html = '<div style="padding:0 18px">'
  + '<div style="background:#1A1200;border:1px solid #FF990030;border-radius:16px;padding:16px;margin-bottom:12px;text-align:center">'
  + '<div style="font-size:30px;margin-bottom:6px">🔒</div>'
  + '<div style="font-size:14px;font-weight:800;color:#FF9900;margin-bottom:4px">Cycle complété !</div>'
  + '<div style="font-size:12px;color:#ffffff70;margin-bottom:12px">Regardez 2 vidéos pour débloquer.</div>'
  + '<div style="display:flex;gap:8px;justify-content:center">';
  for (var i = 0; i < 2; i++) {
    html += '<div style="width:36px;height:36px;border-radius:99px;background:' + (S.unlockW>i?"#FF990030":"#1A1A2A") + ';border:2px solid ' + (S.unlockW>i?"#FF9900":"#333") + ';display:flex;align-items:center;justify-content:center;font-size:16px">' + (S.unlockW>i?"✅":"👁") + '</div>';
  }
  html += '</div></div>';
  for (var j = 0; j < UNLOCK_ADS.length; j++) {
    var ad = UNLOCK_ADS[j]; var isWU = S.unlockW > j;
    html += '<div style="background:#111120;border:1px solid ' + (isWU?"#FF990030":"#2A2A1A") + ';border-radius:14px;padding:12px;display:flex;align-items:center;gap:10px;margin-bottom:8px;opacity:' + (isWU?0.6:1) + '">'
    + '<div style="width:44px;height:44px;border-radius:10px;background:' + ad.color + '20;border:1px solid ' + ad.color + '40;display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0">' + (isWU?"✅":ad.emoji) + '</div>'
    + '<div style="flex:1"><div style="font-size:13px;font-weight:700">' + ad.brand + '</div>'
    + '<div style="font-size:9px;color:#ffffff40;margin-top:3px">⏱ ' + ad.duration + 's</div></div>'
    + '<div style="text-align:right">'
    + (isWU ? '<div style="background:#FF990020;border-radius:6px;padding:4px 10px;font-size:11px;color:#FF9900">✅ Vu</div>'
            : '<button class="btn" onclick="startAd(\'' + ad.id + '\',true)" style="background:linear-gradient(135deg,#FF9900,#FFD700);color:#000;border-radius:6px;padding:4px 10px;font-size:11px">▶ Débloquer</button>')
    + '</div></div>';
  }
  html += '</div>';
  return html;
}

function buildWatching() {
  var ad = S.currentAd;
  if (!ad) return "";
  return '<div style="position:fixed;inset:0;background:#050508;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px;z-index:100">'
  + '<div style="width:220px;height:220px;border-radius:28px;background:' + ad.color + '20;border:2px solid ' + ad.color + '50;display:flex;flex-direction:column;align-items:center;justify-content:center;margin-bottom:24px;gap:8px">'
  + '<span style="font-size:56px">' + ad.emoji + '</span>'
  + '<span style="font-size:18px;font-weight:800;color:#fff">' + ad.brand + '</span>'
  + '<span style="font-size:11px;color:#ffffff70">' + ad.title + '</span>'
  + (S.isUnlock ? '<div style="background:#FF990015;border-radius:20px;padding:3px 12px;font-size:11px;color:#FF9900">🔓 DÉBLOCAGE</div>'
                : '<div style="background:#ffffff15;border-radius:20px;padding:3px 12px;font-size:11px;color:#fff">● PUB EN COURS</div>')
  + '</div>'
  + '<div id="tl" style="font-size:44px;font-weight:700;color:#fff;margin-bottom:8px">' + S.timeLeft + 's</div>'
  + '<div style="font-size:12px;color:#ffffff50;margin-bottom:20px">Regardez jusqu\'à la fin pour gagner</div>'
  + (S.isUnlock ? "" : '<div style="background:#00E5A015;border:1px solid #00E5A030;border-radius:12px;padding:8px 20px;font-size:18px;font-weight:700;color:#00E5A0;margin-bottom:24px">+' + ad.reward.toFixed(2) + ' €</div>')
  + '<div style="width:100%;height:5px;background:#1A1A2A;border-radius:99px;overflow:hidden">'
  + '<div id="pb" style="height:100%;border-radius:99px;width:' + S.progress + '%;background:' + (S.isUnlock?"#FF9900":"#00E5A0") + '"></div></div></div>';
}

function buildSuccess(bal) {
  return '<div style="position:fixed;inset:0;background:#050508;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px;z-index:100">'
  + '<div style="font-size:64px;margin-bottom:16px">' + (S.isUnlock?"🔓":"🎉") + '</div>'
  + '<div style="font-size:22px;font-weight:800;margin-bottom:6px">' + (S.isUnlock?tx("Vidéo vue !","Video watched!"):tx("Bravo !","Well done!")) + '</div>'
  + (!S.isUnlock ? '<div style="font-size:40px;font-weight:800;color:#00E5A0;margin-bottom:6px">+' + (S.earned||0).toFixed(2) + ' €</div>'
                 + '<div style="font-size:12px;color:#ffffff40;margin-bottom:20px">Nouveau solde : ' + bal.toFixed(2) + ' €</div>' : '<div style="margin-bottom:24px"></div>')
  + '<button class="btn" onclick="S.screen=\'home\';render()" style="background:linear-gradient(135deg,#00E5A0,#00B4D8);color:#000;border-radius:12px;padding:13px 36px;font-size:14px">Continuer →</button></div>';
}

function buildUnlocked() {
  return '<div style="position:fixed;inset:0;background:#050508;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px;z-index:100">'
  + '<div style="font-size:72px;margin-bottom:16px">🎊</div>'
  + '<div style="font-size:26px;font-weight:800;margin-bottom:8px;color:#00E5A0">Déblocage !</div>'
  + '<div style="font-size:14px;color:#ffffff70;margin-bottom:28px;text-align:center">Les 6 pubs sont à nouveau disponibles !</div>'
  + '<button class="btn" onclick="S.screen=\'home\';render()" style="background:linear-gradient(135deg,#00E5A0,#00B4D8);color:#000;border-radius:12px;padding:13px 36px;font-size:14px">C\'est parti ! →</button></div>';
}

function buildWithdraw(bal) {
  return '<div style="padding:22px;min-height:100vh;background:#0A0A0F">'
  + '<button class="btn" onclick="S.screen=\'home\';S.wDone=false;S.wErr=\'\';render()" style="background:none;border:none;color:#ffffff60;font-size:13px;cursor:pointer;margin-bottom:18px">← Retour</button>'
  + '<div style="font-size:20px;font-weight:800;margin-bottom:4px">Retrait PayPal</div>'
  + '<div style="font-size:12px;color:#ffffff50;margin-bottom:20px">Min. 10€ — Solde : <span style="color:#00E5A0">' + bal.toFixed(2) + ' €</span></div>'
  + (!S.wDone ? (bal < 10 ? '<div style="background:#FF450015;border:1px solid #FF450040;border-radius:8px;padding:10px;font-size:12px;color:#FF9060;margin-bottom:14px">⚠️ Il vous manque ' + (10-bal).toFixed(2) + '€</div>' : "")
  + '<div style="margin-bottom:12px"><div style="font-size:11px;color:#ffffff60;margin-bottom:5px">Email PayPal</div>'
  + '<input type="email" placeholder="you@paypal.com" value="' + (S.wEmail||"") + '" oninput="S.wEmail=this.value" style="width:100%;background:#111120;border:1px solid #2A2A3A;border-radius:10px;padding:12px;color:#fff;font-size:14px"/></div>'
  + (S.wErr ? '<div style="background:#FF450015;border-radius:8px;padding:10px;font-size:12px;color:#FF9060;margin-bottom:12px">⚠️ ' + S.wErr + '</div>' : "")
  + '<button class="btn" onclick="doWithdraw()" style="width:100%;background:' + (bal>=10&&S.wEmail?"linear-gradient(135deg,#00E5A0,#00B4D8)":"#1A1A2A") + ';color:' + (bal>=10&&S.wEmail?"#000":"#ffffff30") + ';border-radius:10px;padding:13px;font-size:14px">'
  + (S.wLoad?"Envoi...":"Envoyer via PayPal 💸") + '</button>'
  : '<div style="text-align:center;padding-top:40px"><div style="font-size:50px;margin-bottom:12px">✅</div>'
  + '<div style="font-size:18px;font-weight:800;margin-bottom:6px">Demande envoyée !</div>'
  + '<div style="font-size:12px;color:#ffffff50">Virement sous 48h ouvrées.</div></div>')
  + '</div>';
}

// ─── INIT ──────────────────────────────────────────────────────────────────
render();
if (S.token) { loadHist(); refreshMe(); }
</script>
</body>
</html>
