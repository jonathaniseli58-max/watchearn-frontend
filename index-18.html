function medal(v){
  if(v>=500) return {icon:"🥇",label:"Or",color:"#FFD700",next:"Max !"};
  if(v>=100) return {icon:"🥈",label:"Silver",color:"#C0C0C0",next:(500-v)+" vues pour Or"};
  return {icon:"🥉",label:"Bronze",color:"#CD7F32",next:(100-v)+" vues pour Silver"};
}

async function api(path,method,body,token){
  method=method||"GET";
  var h={"Content-Type":"application/json"};
  if(token) h["Authorization"]="Bearer "+token;
  try{
    var r=await fetch(API+path,{method:method,headers:h,body:body?JSON.stringify(body):null});
    var d=await r.json();
    if(!r.ok) throw new Error(d.error||"Erreur serveur");
    return d;
  }catch(e){throw new Error(e.message||"Erreur connexion");}
}
