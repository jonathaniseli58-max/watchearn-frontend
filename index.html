<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WatchEarn — Regardez des pubs, gagnez de l'argent</title>
  <link rel="manifest" href="/manifest.json" />
  <meta name="theme-color" content="#00E5A0" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="WatchEarn" />
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{background:#0A0A0F;font-family:'Syne',sans-serif;color:#F0F0F0}
    ::-webkit-scrollbar{display:none}
    @keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}
    @keyframes slideUp{from{transform:translateY(30px);opacity:0}to{transform:translateY(0);opacity:1}}
    @keyframes coinPop{0%{transform:scale(0) rotate(-20deg);opacity:0}60%{transform:scale(1.3) rotate(5deg)}100%{transform:scale(1) rotate(0);opacity:1}}
    @keyframes glow{0%,100%{box-shadow:0 0 20px #00E5A020}50%{box-shadow:0 0 40px #00E5A060}}
    @keyframes spin{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
    @keyframes unlockPop{0%{transform:scale(.8);opacity:0}100%{transform:scale(1);opacity:1}}
    .btn{transition:all .2s;cursor:pointer;border:none;font-family:'Syne',sans-serif;font-weight:700}
    .btn:active{transform:scale(.97)}
    input{outline:none;font-family:'Syne',sans-serif}
    .nav-btn{background:none;border:none;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;font-family:'Syne',sans-serif;padding:4px 8px}
    .hidden{display:none!important}
    .slide-up{animation:slideUp 0.3s ease}
    #app{max-width:420px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column}
  </style>
</head>
<body>
<div id="app"></div>

<script>
// ─── CONFIG ────────────────────────────────────────────────────────────────
if('serviceWorker' in navigator){
  navigator.serviceWorker.getRegistrations().then(function(r){r.forEach(function(x){x.unregister();});});
}
var _sv = localStorage.getItem("we_lang");
var _dt = (navigator.language||"fr").toLowerCase().startsWith("en") ? "en" : "fr";
var WL = _sv || _dt;
if(!_sv) localStorage.setItem("we_lang", WL);

var EN = WL === "en";
function tx(fr, en){ return EN ? en : fr; }

var API = "https://watchearn-backend.onrender.com";

var ADS = [
  {id:"1",brand:"Nike",title:"Just Do It 2026",reward:0.13,duration:30,color:"#FF4500",emoji:"👟"},
  {id:"2",brand:"Spotify",title:tx("Musique Sans Limite","Music Without Limits"),reward:0.08,duration:20,color:"#1DB954",emoji:"🎵"},
  {id:"3",brand:"Amazon",title:tx("Deals du Jour","Today's Deals"),reward:0.18,duration:35,color:"#FF9900",emoji:"📦"},
  {id:"4",brand:"Netflix",title:tx("Ce Soir Sur Netflix","Tonight on Netflix"),reward:0.10,duration:25,color:"#E50914",emoji:"🎬"},
  {id:"5",brand:"Apple",title:"iPhone 17 Pro",reward:0.23,duration:40,color:"#A8A8A8",emoji:"📱"},
  {id:"6",brand:"Adidas",title:"Impossible Is Nothing",reward:0.08,duration:30,color:"#444",emoji:"⚽"},
];
var UNLOCK_ADS = [
  {id:"u1",brand:"McDonald's",title:"I'm Lovin' It",duration:20,color:"#FFC300",emoji:"🍔"},
  {id:"u2",brand:"Samsung",title:"Galaxy S26",duration:25,color:"#1428A0",emoji:"📲"},
];

// ─── STATE ────────────────────────────────────────────────────────────────
var S = {
  user: null,
  token: null,
  screen: "home",       // home | watching | success | unlocked | withdraw
  currentAd: null,
  isUnlock: false,
  progress: 0,
  timeLeft: 0,
  history: [],
  watched: {},
  phase: "watch",       // watch | unlock
  unlockW: 0,
  totalViews: 0,
  totalEarned: 0,
  earned: null,
  wEmail: "",
  wDone: false,
  wLoad: false,
  wErr: "",
  timerInterval: null,
  authMode: "login",
  authName: "",
  authEmail: "",
  authPass: "",
  authErr: "",
  authLoad: false,
};

// Load persisted state
(function(){
  var tk = localStorage.getItem("we_token");
  var u  = localStorage.getItem("we_user");
  var w  = localStorage.getItem("we_watched");
  var p  = localStorage.getItem("we_phase");
  var uw = localStorage.getItem("we_unlock_w");
  if(tk && u){
    S.token = tk;
    S.user  = JSON.parse(u);
    S.totalViews   = S.user.total_views  || 0;
    S.totalEarned  = S.user.total_earned || 0;
  }
  if(w)  S.watched  = JSON.parse(w);
  if(p)  S.phase    = p;
  if(uw) S.unlockW  = parseInt(uw);
})();

// ─── HELPERS ──────────────────────────────────────────────────────────────
function medal(v){
  if(v>=500) return {icon:"🥇",label:tx("Or","Gold"),color:"#FFD700",next:tx("Max !","Max!")};
  if(v>=100) return {icon:"🥈",label:"Silver",color:"#C0C0C0",next:(500-v)+tx(" vues pour Or"," views for Gold")};
  return {icon:"🥉",label:"Bronze",color:"#CD7F32",next:(100-v)+tx(" vues pour Silver"," views for Silver")};
}

async function api(path, method, body, token){
  method = method || "GET";
  var h = {"Content-Type":"application/json"};
  if(token) h["Authorization"] = "Bearer " + token;
  try{
    var r = await fetch(API + path, {method:method, headers:h, body:body ? JSON.stringify(body) : null});
    var d = await r.json();
    if(!r.ok) throw new Error(d.error || "Error");
    return d;
  }catch(e){ throw new Error(e.message || "Connection error"); }
}

function render(){ document.getElementById("app").innerHTML = buildApp(); bindEvents(); }

// ─── ADMOB BRIDGE ─────────────────────────────────────────────────────────
window.admobRewardEarned = function(){
  console.log("AdMob reward earned!");
  if(S.currentAd){
    clearInterval(S.timerInterval);
    finishAd(S.currentAd, S.isUnlock);
  }
};

// ─── AUTH ACTIONS ─────────────────────────────────────────────────────────
async function doAuth(){
  if(!S.authEmail || !S.authPass || (S.authMode==="register" && !S.authName)){
    S.authErr = tx("Veuillez remplir tous les champs","Please fill in all fields");
    render(); return;
  }
  S.authErr = ""; S.authLoad = true; render();
  try{
    var path = S.authMode==="login" ? "/auth/login" : "/auth/register";
    var body = S.authMode==="login"
      ? {email:S.authEmail, password:S.authPass}
      : {email:S.authEmail, password:S.authPass, name:S.authName};
    var d = await api(path, "POST", body, null);
    localStorage.setItem("we_token", d.token);
    localStorage.setItem("we_user", JSON.stringify(d.user));
    S.token = d.token; S.user = d.user;
    S.totalViews  = d.user.total_views  || 0;
    S.totalEarned = d.user.total_earned || 0;
    loadHist(); refreshMe();
  }catch(e){ S.authErr = e.message; }
  S.authLoad = false; render();
}

function logout(){
  localStorage.removeItem("we_token");
  localStorage.removeItem("we_user");
  S.user = null; S.token = null; S.history = [];
  render();
}

async function loadHist(){
  try{ var d = await api("/me/history","GET",null,S.token); S.history = d.slice(0,10); render(); }catch(e){}
}
async function refreshMe(){
  try{
    var d = await api("/me","GET",null,S.token);
    S.user = d; S.totalViews = d.total_views||0; S.totalEarned = d.total_earned||0;
    localStorage.setItem("we_user", JSON.stringify(d)); render();
  }catch(e){}
}

// ─── AD ACTIONS ───────────────────────────────────────────────────────────
function startAd(ad, unlock){
  clearInterval(S.timerInterval);
  S.currentAd = ad; S.isUnlock = unlock||false;
  S.screen = "watching"; S.progress = 0; S.timeLeft = ad.duration;
  window._currentAdForAdmob = ad;
  window._isUnlockAdmob     = unlock||false;
  render();
  // Timer fallback (web)
  S.timerInterval = setInterval(function(){
    S.timeLeft = Math.max(0, S.timeLeft - 1);
    S.progress += 100 / ad.duration;
    if(S.progress >= 100){
      clearInterval(S.timerInterval);
      S.progress = 100;
      finishAd(ad, unlock||false);
      return;
    }
    // just update progress bar & timer without full re-render for perf
    var pb = document.getElementById("progress-bar");
    var tl = document.getElementById("time-left");
    if(pb) pb.style.width = S.progress + "%";
    if(tl) tl.textContent = S.timeLeft + "s";
  }, 1000);
  // Signal Kodular
  console.log("action=show_ad");
}

async function finishAd(ad, unlock){
  clearInterval(S.timerInterval);
  if(unlock){
    var nu = (parseInt(localStorage.getItem("we_unlock_w"))||0) + 1;
    S.unlockW = nu; localStorage.setItem("we_unlock_w", nu);
    if(nu >= 2){
      S.watched={}; S.phase="watch"; S.unlockW=0; S.earned=null;
      localStorage.setItem("we_watched","{}");
      localStorage.setItem("we_phase","watch");
      localStorage.setItem("we_unlock_w","0");
      S.screen = "unlocked";
    } else {
      S.earned = null; S.screen = "success";
    }
    render(); return;
  }
  try{
    var d = await api("/ads/"+ad.id+"/complete","POST",{},S.token);
    var nv = d.total_views  || S.totalViews  + 1;
    var ne = d.total_earned || +(S.totalEarned + ad.reward).toFixed(2);
    S.user = Object.assign({}, S.user, {balance:d.new_balance, total_views:nv, total_earned:ne});
    localStorage.setItem("we_user", JSON.stringify(S.user));
    S.totalViews = nv; S.totalEarned = ne;
    S.history = [{ad_id:ad.id, reward:d.reward, created_at:new Date()}, ...S.history];
    S.earned = d.reward;
  }catch(e){
    var nb = +((S.user ? S.user.balance : 0) + ad.reward).toFixed(2);
    S.user = Object.assign({}, S.user, {balance:nb});
    S.totalViews  += 1;
    S.totalEarned  = +(S.totalEarned + ad.reward).toFixed(2);
    S.earned = ad.reward;
  }
  var nw = Object.assign({}, S.watched); nw[ad.id] = true;
  S.watched = nw; localStorage.setItem("we_watched", JSON.stringify(nw));
  if(Object.keys(nw).length >= ADS.length){ S.phase="unlock"; localStorage.setItem("we_phase","unlock"); }
  S.screen = "success"; render();
}

async function doWithdraw(){
  if(!S.wEmail || !S.user || S.user.balance < 10) return;
  S.wLoad = true; S.wErr = ""; render();
  try{
    await api("/withdraw","POST",{paypal_email:S.wEmail},S.token);
    S.user = Object.assign({}, S.user, {balance:0});
    localStorage.setItem("we_user", JSON.stringify(S.user));
    S.wDone = true;
  }catch(e){ S.wErr = e.message; }
  S.wLoad = false; render();
}

// ─── BUILD HTML ───────────────────────────────────────────────────────────
function buildApp(){
  if(!S.user) return buildAuth();
  var bal = S.user.balance || 0;
  var m   = medal(S.totalViews);

  var overlay = "";
  if(S.screen === "watching") overlay = buildWatching(bal);
  else if(S.screen === "success") overlay = buildSuccess(bal);
  else if(S.screen === "unlocked") overlay = buildUnlocked();

  return `
  <div style="min-height:100vh;background:#0A0A0F;color:#F0F0F0;font-family:'Syne',sans-serif;display:flex;flex-direction:column;max-width:420px;margin:0 auto">
    ${buildHeader(bal)}
    ${overlay}
    ${S.screen === "withdraw" ? buildWithdraw(bal) : ""}
    ${S.screen === "home" ? buildHome(bal, m) : ""}
    ${S.screen === "home" ? buildBottomNav() : ""}
  </div>`;
}

function buildHeader(bal){
  var user = S.user;
  return `
  <header style="padding:14px 20px;border-bottom:1px solid #1A1A2A;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:10;background:#0A0A0Fdd;backdrop-filter:blur(12px)">
    <div style="display:flex;align-items:center;gap:10px">
      <div style="width:32px;height:32px;border-radius:9px;background:linear-gradient(135deg,#00E5A0,#00B4D8);display:flex;align-items:center;justify-content:center;font-size:15px">▶</div>
      <div>
        <div style="font-size:15px;font-weight:800;line-height:1">WatchEarn</div>
        <div style="font-size:10px;color:#ffffff40">${tx("Bonjour","Hello")} ${user.name||""} 👋</div>
      </div>
    </div>
    <div style="display:flex;gap:6px;align-items:center">
      <div style="background:#111120;border:1px solid #00E5A030;border-radius:9px;padding:5px 11px;animation:glow 3s ease infinite">
        <span style="font-size:13px;color:#00E5A0;font-family:'DM Mono',monospace;font-weight:500">💰 ${bal.toFixed(2)} €</span>
      </div>
      <button class="btn" onclick="toggleLang()" style="background:#1A1A2A;border:1px solid #2A2A3A;border-radius:8px;padding:4px 8px;font-size:10px;color:#ffffff60">${EN?"FR":"EN"}</button>
      <button class="btn" onclick="logout()" style="background:#1A1A2A;border:none;border-radius:8px;padding:5px 9px;color:#ffffff50;font-size:13px">⎋</button>
    </div>
  </header>`;
}

function buildHome(bal, m){
  var watchedCount = Object.keys(S.watched).length;
  return `
  <div style="flex:1;overflow-y:auto;padding-bottom:90px">

    <!-- BALANCE CARD -->
    <div style="padding:14px 20px 0">
      <div style="background:linear-gradient(135deg,#111120,#0D1A2A);border:1px solid #00E5A025;border-radius:20px;padding:20px;margin-bottom:8px;position:relative;overflow:hidden">
        <div style="position:absolute;top:-40px;right:-40px;width:120px;height:120px;background:radial-gradient(circle,#00E5A015,transparent);border-radius:50%"></div>
        <div style="font-size:11px;color:#ffffff50;margin-bottom:3px;letter-spacing:0.1em">${tx("SOLDE DISPONIBLE","AVAILABLE BALANCE")}</div>
        <div style="font-size:38px;font-weight:800;font-family:'DM Mono',monospace;background:linear-gradient(135deg,#00E5A0,#00B4D8);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:12px">${bal.toFixed(2)} €</div>
        <button class="btn" onclick="S.screen='withdraw';S.wDone=false;S.wErr='';render()"
          style="background:${bal>=10?"linear-gradient(135deg,#00E5A0,#00B4D8)":"#1A1A2A"};color:${bal>=10?"#000":"#ffffff40"};border-radius:9px;padding:9px 18px;font-size:12px">
          ${bal>=10 ? tx("💸 Retirer via PayPal","💸 Withdraw via PayPal") : tx("🔒 Encore ","🔒 Need ")+(10-bal).toFixed(2)+tx("€ pour retirer","€ more")}
        </button>
      </div>

      <!-- STATS ROW -->
      <div style="display:flex;gap:6px;margin-bottom:14px;margin-top:6px">
        ${[
          {icon:"👁",val:S.totalViews,label:tx("Pubs vues","Ads watched"),color:null},
          {icon:"📈",val:S.totalEarned.toFixed(2)+"€",label:tx("Total gagné","Total earned"),color:null},
          {icon:m.icon,val:m.label,label:m.next,color:m.color},
        ].map(function(s){return `
          <div style="flex:1;background:#111120;border:1px solid ${s.color?s.color+"30":"#1A1A2A"};border-radius:11px;padding:9px 5px;text-align:center">
            <div style="font-size:${s.color?20:15}px;margin-bottom:2px">${s.icon}</div>
            <div style="font-size:12px;font-weight:700;font-family:'DM Mono',monospace;color:${s.color||"#fff"}">${s.val}</div>
            <div style="font-size:9px;color:${s.color||"#ffffff40"};margin-top:1px">${s.label}</div>
          </div>`;}).join("")}
      </div>
    </div>

    <!-- PROGRESS BAR -->
    <div style="padding:0 20px 12px">
      <div style="background:#111120;border:1px solid #1A1A2A;border-radius:14px;padding:11px 14px">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:7px">
          <div style="font-size:12px;font-weight:700;color:#fff">${S.phase==="unlock"?tx("🔒 Débloquer le prochain cycle","🔒 Unlock next cycle"):tx("📺 Cycle en cours","📺 Cycle in progress")}</div>
          <div style="font-size:11px;color:#00E5A0;font-family:'DM Mono',monospace">${S.phase==="unlock"?S.unlockW+tx("/2 vidéos","/2 videos"):watchedCount+tx("/6 pubs","/6 ads")}</div>
        </div>
        <div style="height:5px;background:#1A1A2A;border-radius:99px;overflow:hidden">
          <div style="height:100%;border-radius:99px;width:${S.phase==="unlock"?(S.unlockW/2*100):(watchedCount/ADS.length*100)}%;background:${S.phase==="unlock"?"linear-gradient(90deg,#FF9900,#FFD700)":"linear-gradient(90deg,#00E5A0,#00B4D8)"};transition:width 0.5s ease"></div>
        </div>
      </div>
    </div>

    <!-- HOW IT WORKS -->
    <div style="padding:0 20px 14px">
      <div style="background:linear-gradient(135deg,#111120,#0D1A2A);border:1px solid #00E5A025;border-radius:18px;padding:18px">
        <div style="font-size:15px;font-weight:800;color:#00E5A0;margin-bottom:6px">${tx("💡 Comment gagner de l'argent ?","💡 How to earn money?")}</div>
        <div style="font-size:12px;color:#ffffff70;line-height:1.8;margin-bottom:12px">${tx("WatchEarn vous permet de gagner de l'argent réel en regardant des publicités. Dès 10€, retirez via PayPal en 48h.","WatchEarn lets you earn real money by watching video ads. Once you reach €10, withdraw via PayPal within 48h.")}</div>
        ${[
          {n:"1",t:tx("Regardez les pubs","Watch ads"),d:tx("Choisissez une pub et regardez-la jusqu'à la fin (20-40 sec).","Choose an ad and watch it to the end (20-40 sec).")},
          {n:"2",t:tx("Gagnez des €","Earn €"),d:tx("0.08€ à 0.23€ crédités automatiquement.","€0.08 to €0.23 credited automatically.")},
          {n:"3",t:tx("Retirez via PayPal","Withdraw via PayPal"),d:tx("Dès 10€, virement en 48h ouvrées.","Once you reach €10, transfer in 48 business hours.")},
        ].map(function(s){return `
          <div style="display:flex;gap:10px;align-items:flex-start;margin-bottom:10px">
            <div style="width:26px;height:26px;border-radius:7px;background:linear-gradient(135deg,#00E5A0,#00B4D8);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:12px;color:#000;flex-shrink:0">${s.n}</div>
            <div>
              <div style="font-size:13px;font-weight:700;color:#fff;margin-bottom:2px">${s.t}</div>
              <div style="font-size:11px;color:#ffffff60;line-height:1.6">${s.d}</div>
            </div>
          </div>`;}).join("")}
      </div>
    </div>

    <!-- REVIEWS -->
    <div style="padding:0 20px 14px">
      <div style="font-size:13px;font-weight:700;margin-bottom:8px;color:#fff">${tx("⭐ Ce que disent nos utilisateurs","⭐ What our users say")}</div>
      ${[
        {n:"Sophie M. 🇫🇷",t:tx("J'ai retiré mes premiers 10€ en une semaine ! Simple et gratuit.","I withdrew my first €10 in one week! Simple and truly free."),s:5},
        {n:"Marco R. 🇨🇭",t:tx("Super app pour gagner pendant mes pauses.","Great app to earn during my breaks."),s:5},
        {n:"Léa K. 🇧🇪",t:tx("J'ai atteint le niveau Or. Le système de cycles est bien pensé.","I reached Gold level. The cycle system is well designed."),s:4},
      ].map(function(r){return `
        <div style="background:#111120;border:1px solid #1A1A2A;border-radius:13px;padding:11px 13px;margin-bottom:7px">
          <div style="display:flex;justify-content:space-between;margin-bottom:5px">
            <div style="font-size:13px;font-weight:700;color:#fff">${r.n}</div>
            <div style="font-size:12px;color:#FFD700">${"★".repeat(r.s)}</div>
          </div>
          <div style="font-size:12px;color:#ffffff70;line-height:1.6">"${r.t}"</div>
        </div>`;}).join("")}
    </div>

    <!-- STATS NUMBERS -->
    <div style="padding:0 20px 14px">
      <div style="background:#111120;border:1px solid #1A1A2A;border-radius:16px;padding:14px">
        <div style="font-size:13px;font-weight:700;color:#fff;margin-bottom:10px;text-align:center">${tx("📊 WatchEarn en chiffres","📊 WatchEarn in numbers")}</div>
        <div style="display:flex;gap:6px">
          ${[{val:"100%",label:tx("Gratuit","Free")},{val:"48h",label:tx("Délai retrait","Withdrawal")},{val:"10€",label:tx("Minimum","Minimum")}].map(function(s){return `
            <div style="flex:1;text-align:center;background:#0A0A0F;border-radius:9px;padding:9px 4px">
              <div style="font-size:17px;font-weight:800;color:#00E5A0;font-family:'DM Mono',monospace">${s.val}</div>
              <div style="font-size:10px;color:#ffffff50;margin-top:2px">${s.label}</div>
            </div>`;}).join("")}
        </div>
      </div>
    </div>

    <!-- ADS LIST -->
    ${S.phase === "watch" ? buildAdsList() : ""}
    ${S.phase === "unlock" ? buildUnlockList() : ""}

    <!-- HISTORY -->
    ${S.history.length > 0 ? `
    <div style="padding:4px 20px 0">
      <div style="font-size:14px;font-weight:700;margin-bottom:9px">${tx("📋 Historique","📋 History")}</div>
      <div style="display:flex;flex-direction:column;gap:7px">
        ${S.history.slice(0,5).map(function(h,i){return `
          <div style="display:flex;align-items:center;justify-content:space-between;padding:9px 13px;background:#111120;border:1px solid #1A1A2A;border-radius:11px">
            <div>
              <div style="font-size:12px;font-weight:600">${tx("Pub regardée","Ad watched")}</div>
              <div style="font-size:10px;color:#ffffff40">${new Date(h.created_at).toLocaleDateString(EN?"en-US":"fr-FR")}</div>
            </div>
            <div style="font-size:13px;font-weight:700;color:#00E5A0;font-family:'DM Mono',monospace">+${(h.reward||0).toFixed(2)} €</div>
          </div>`;}).join("")}
      </div>
    </div>` : ""}

    <!-- FAQ -->
    <div style="padding:16px 20px 0">
      <div style="font-size:14px;font-weight:700;margin-bottom:10px">${tx("❓ Questions fréquentes","❓ FAQ")}</div>
      ${buildFaq()}
    </div>

  var arr = document.getElementById("faq-arrow-"+i);
  if(!ans) return;
  var open = ans.style.display !== "none";
  ans.style.display = open ? "none" : "block";
  if(arr) arr.textContent = open ? "▼" : "▲";
}

function toggleLang(){
  localStorage.setItem("we_lang", EN ? "fr" : "en");
  window.location.reload();
}

// ─── INIT ──────────────────────────────────────────────────────────────────
render();
if(S.token){ loadHist(); refreshMe(); }
</script>
