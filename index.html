<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WatchEarn — Regardez des pubs, gagnez de l'argent</title>
  <link rel="manifest" href="/manifest.json" />
  <meta name="theme-color" content="#00E5A0" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="WatchEarn" />
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-6405779707135951" crossorigin="anonymous"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #0A0A0F; font-family: 'Syne', sans-serif; }
    ::-webkit-scrollbar { display: none; }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.5} }
    @keyframes slideUp { from{transform:translateY(30px);opacity:0} to{transform:translateY(0);opacity:1} }
    @keyframes coinPop { 0%{transform:scale(0) rotate(-20deg);opacity:0} 60%{transform:scale(1.3) rotate(5deg)} 100%{transform:scale(1) rotate(0);opacity:1} }
    @keyframes glow { 0%,100%{box-shadow:0 0 20px #00E5A020} 50%{box-shadow:0 0 40px #00E5A060} }
    @keyframes spin { from{transform:rotate(0deg)} to{transform:rotate(360deg)} }
    @keyframes unlockPop { 0%{transform:scale(0.8);opacity:0} 100%{transform:scale(1);opacity:1} }
    .btn { transition: all 0.2s; cursor: pointer; border: none; font-family: 'Syne', sans-serif; font-weight: 700; }
    .btn:active { transform: scale(0.97); }
    input { outline: none; }
    .faq-item { background: #111120; border: 1px solid #1A1A2A; border-radius: 12px; padding: 12px 14px; margin-bottom: 8px; cursor: pointer; }
    .nav-btn { background: none; border: none; display: flex; flex-direction: column; align-items: center; gap: 2px; cursor: pointer; font-family: 'Syne', sans-serif; padding: 4px 8px; }
  </style>
</head>
<body>
  <div id="root"></div>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(function(regs) {
        regs.forEach(function(reg) { reg.unregister(); });
      });
    }
  </script>
  <script type="text/babel">
    const { useState, useEffect, useRef } = React;
    const API_URL = "https://watchearn-backend-production-78df.up.railway.app";

    const ADS = [
      { id:"1", brand:"Nike", title:"Just Do It 2026", reward:0.13, duration:30, color:"#FF4500", emoji:"👟" },
      { id:"2", brand:"Spotify", title:"Musique Sans Limite", reward:0.08, duration:20, color:"#1DB954", emoji:"🎵" },
      { id:"3", brand:"Amazon", title:"Deals du Jour", reward:0.18, duration:35, color:"#FF9900", emoji:"📦" },
      { id:"4", brand:"Netflix", title:"Ce Soir Sur Netflix", reward:0.10, duration:25, color:"#E50914", emoji:"🎬" },
      { id:"5", brand:"Apple", title:"iPhone 17 Pro", reward:0.23, duration:40, color:"#A8A8A8", emoji:"📱" },
      { id:"6", brand:"Adidas", title:"Impossible Is Nothing", reward:0.18, duration:30, color:"#444", emoji:"⚽" },
    ];

    // 2 vidéos bonus non rémunérées pour débloquer
    const UNLOCK_ADS = [
      { id:"u1", brand:"McDonald's", title:"I'm Lovin' It", duration:20, color:"#FFC300", emoji:"🍔" },
      { id:"u2", brand:"Samsung", title:"Galaxy S26", duration:25, color:"#1428A0", emoji:"📲" },
    ];

    const FAQ_DATA = [
      {q:"Est-ce vraiment gratuit ?", a:"Oui, WatchEarn est 100% gratuit. Nos revenus viennent uniquement des annonceurs."},
      {q:"Combien puis-je gagner par jour ?", a:"En regardant les 6 pubs quotidiennes, vous pouvez gagner jusqu'à 1€ par cycle. Débloquez de nouveaux cycles en regardant 2 vidéos bonus."},
      {q:"Comment fonctionne le retrait PayPal ?", a:"Dès 5€ accumulés, demandez un virement sur votre PayPal. Traitement en 24-48h ouvrées."},
      {q:"Mes données sont-elles sécurisées ?", a:"Oui, toutes vos données sont chiffrées SSL et ne sont jamais partagées avec des tiers."},
      {q:"Puis-je installer l'app sur mon téléphone ?", a:"Oui ! WatchEarn s'installe sur votre écran d'accueil comme une vraie application mobile."},
    ];

    async function apiCall(path, method, body, token) {
      method = method || "GET";
      const headers = { "Content-Type": "application/json" };
      if (token) headers["Authorization"] = "Bearer " + token;
      try {
        const res = await fetch(API_URL + path, { method: method, headers: headers, body: body ? JSON.stringify(body) : null });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || "Erreur serveur");
        return data;
      } catch(e) { throw new Error(e.message || "Erreur connexion"); }
    }

    function FaqItem(props) {
      const [open, setOpen] = useState(false);
      return (
        <div className="faq-item" onClick={function(){ setOpen(!open); }}>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}>
            <div style={{fontSize:13,fontWeight:600,color:"#fff",flex:1,paddingRight:8}}>{props.q}</div>
            <div style={{color:"#00E5A0",fontSize:14}}>{open ? "▲" : "▼"}</div>
          </div>
          {open && <div style={{fontSize:12,color:"#ffffff70",lineHeight:1.7,marginTop:8,paddingTop:8,borderTop:"1px solid #1A1A2A"}}>{props.a}</div>}
        </div>
      );
    }

    function AuthScreen(props) {
      const [mode, setMode] = useState("login");
      const [name, setName] = useState("");
      const [email, setEmail] = useState("");
      const [password, setPassword] = useState("");
      const [loading, setLoading] = useState(false);
      const [error, setError] = useState("");

      async function handle() {
        if (!email || !password || (mode==="register" && !name)) { setError("Veuillez remplir tous les champs"); return; }
        setError(""); setLoading(true);
        try {
          const path = mode==="login" ? "/auth/login" : "/auth/register";
          const body = mode==="login" ? {email:email,password:password} : {email:email,password:password,name:name};
          const data = await apiCall(path, "POST", body, null);
          localStorage.setItem("we_token", data.token);
          localStorage.setItem("we_user", JSON.stringify(data.user));
          props.onLogin(data.user, data.token);
        } catch(e) { setError(e.message); }
        finally { setLoading(false); }
      }

      return (
        <div style={{minHeight:"100vh",background:"#0A0A0F",display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",padding:24,animation:"slideUp 0.4s ease",color:"#F0F0F0"}}>
          <div style={{display:"flex",alignItems:"center",gap:12,marginBottom:36}}>
            <div style={{width:46,height:46,borderRadius:13,background:"linear-gradient(135deg,#00E5A0,#00B4D8)",display:"flex",alignItems:"center",justifyContent:"center",fontSize:22}}>▶</div>
            <span style={{fontSize:26,fontWeight:800,color:"#fff"}}>WatchEarn</span>
          </div>
          <div style={{width:"100%",maxWidth:380,background:"#111120",border:"1px solid #1A1A2A",borderRadius:24,padding:26}}>
            <div style={{fontSize:21,fontWeight:800,color:"#fff",marginBottom:4}}>{mode==="login"?"Connexion":"Créer un compte"}</div>
            <div style={{fontSize:12,color:"#ffffff50",marginBottom:22}}>{mode==="login"?"Accédez à votre solde":"Commencez à gagner de l'argent"}</div>
            {mode==="register" && (
              <div style={{marginBottom:12}}>
                <div style={{fontSize:11,color:"#ffffff60",marginBottom:5}}>Prénom</div>
                <input value={name} onChange={function(e){setName(e.target.value);}} placeholder="Jonathan"
                  style={{width:"100%",background:"#0A0A0F",border:"1px solid #2A2A3A",borderRadius:12,padding:"13px 16px",color:"#fff",fontSize:15,fontFamily:"'Syne',sans-serif"}} />
              </div>
            )}
            <div style={{marginBottom:12}}>
              <div style={{fontSize:11,color:"#ffffff60",marginBottom:5}}>Email</div>
              <input type="email" value={email} onChange={function(e){setEmail(e.target.value);}} placeholder="vous@exemple.com"
                style={{width:"100%",background:"#0A0A0F",border:"1px solid #2A2A3A",borderRadius:12,padding:"13px 16px",color:"#fff",fontSize:15,fontFamily:"'DM Mono',monospace"}} />
            </div>
            <div style={{marginBottom:18}}>
              <div style={{fontSize:11,color:"#ffffff60",marginBottom:5}}>Mot de passe</div>
              <input type="password" value={password} onChange={function(e){setPassword(e.target.value);}} placeholder="••••••••"
                style={{width:"100%",background:"#0A0A0F",border:"1px solid #2A2A3A",borderRadius:12,padding:"13px 16px",color:"#fff",fontSize:15,fontFamily:"'DM Mono',monospace"}} />
            </div>
            {error && <div style={{background:"#FF450015",border:"1px solid #FF450040",borderRadius:10,padding:"9px 13px",fontSize:12,color:"#FF9060",marginBottom:14}}>⚠️ {error}</div>}
            <button className="btn" onClick={handle} disabled={loading}
              style={{width:"100%",background:"linear-gradient(135deg,#00E5A0,#00B4D8)",color:"#000",borderRadius:12,padding:"14px",fontSize:14,display:"flex",alignItems:"center",justifyContent:"center"}}>
              {loading ? <span style={{width:16,height:16,border:"2px solid #00000030",borderTopColor:"#000",borderRadius:"50%",animation:"spin 0.8s linear infinite",display:"inline-block"}}/> : (mode==="login"?"Se connecter →":"Créer mon compte →")}
            </button>
            <div style={{textAlign:"center",marginTop:16,fontSize:12,color:"#ffffff40"}}>
              {mode==="login"?"Pas encore de compte ?":"Déjà un compte ?"}
              <span onClick={function(){setMode(mode==="login"?"register":"login");setError("");}} style={{color:"#00E5A0",cursor:"pointer",marginLeft:5,fontWeight:600}}>
                {mode==="login"?"S'inscrire":"Se connecter"}
              </span>
            </div>
          </div>
        </div>
      );
    }

    function App() {
      const [user, setUser] = useState(null);
      const [token, setToken] = useState(null);
      const [screen, setScreen] = useState("home");
      const [currentAd, setCurrentAd] = useState(null);
      const [isUnlockAd, setIsUnlockAd] = useState(false);
      const [progress, setProgress] = useState(0);
      const [timeLeft, setTimeLeft] = useState(0);
      const [history, setHistory] = useState([]);
      const [withdrawEmail, setWithdrawEmail] = useState("");
      const [withdrawDone, setWithdrawDone] = useState(false);
      const [earned, setEarned] = useState(null);
      const [wLoading, setWLoading] = useState(false);
      const [wError, setWError] = useState("");

      // Suivi des pubs vues et déblocage
      const [watchedAds, setWatchedAds] = useState({}); // {adId: true}
      const [phase, setPhase] = useState("watch"); // "watch" | "unlock" | "complete"
      const [unlockWatched, setUnlockWatched] = useState(0); // 0, 1, 2

      // Stats cumulatives
      const [totalViews, setTotalViews] = useState(0);
      const [totalEarned, setTotalEarned] = useState(0);

      const intervalRef = useRef(null);

      useEffect(function() {
        var t = localStorage.getItem("we_token");
        var u = localStorage.getItem("we_user");
        var w = localStorage.getItem("we_watched");
        var p = localStorage.getItem("we_phase");
        var uw = localStorage.getItem("we_unlock_watched");
        if (t && u) { setToken(t); setUser(JSON.parse(u)); loadHistory(t); }
        if (w) setWatchedAds(JSON.parse(w));
        if (p) setPhase(p);
        if (uw) setUnlockWatched(parseInt(uw));
        // Stats cumulatives
        var tv = localStorage.getItem("we_total_views");
        var te = localStorage.getItem("we_total_earned");
        if (tv) setTotalViews(parseInt(tv));
        if (te) setTotalEarned(parseFloat(te));
      }, []);

      async function loadHistory(t) {
        try { var d = await apiCall("/me/history","GET",null,t); setHistory(d.slice(0,10)); } catch(e){}
      }

      function handleLogin(u, t) { setUser(u); setToken(t); loadHistory(t); }

      function handleLogout() {
        localStorage.removeItem("we_token"); localStorage.removeItem("we_user");
        setUser(null); setToken(null); setHistory([]);
      }

      function watchAd(ad, unlock) {
        setCurrentAd(ad);
        setIsUnlockAd(unlock || false);
        setProgress(0);
        setTimeLeft(ad.duration);
        setScreen("watching");
      }

      useEffect(function() {
        if (screen==="watching" && currentAd) {
          intervalRef.current = setInterval(function() {
            setProgress(function(p) {
              var next = p + 100/currentAd.duration;
              if (next >= 100) {
                clearInterval(intervalRef.current);
                completeAd();
                return 100;
              }
              return next;
            });
            setTimeLeft(function(t) { return Math.max(0, t-1); });
          }, 1000);
        }
        return function() { clearInterval(intervalRef.current); };
      }, [screen, currentAd]);

      async function completeAd() {
        if (isUnlockAd) {
          // Pub de déblocage — pas de gain pour l'utilisateur
          var newUnlock = unlockWatched + 1;
          setUnlockWatched(newUnlock);
          localStorage.setItem("we_unlock_watched", newUnlock);
          if (newUnlock >= 2) {
            // Toutes les pubs de déblocage vues → réinitialiser
            setWatchedAds({});
            setPhase("watch");
            setUnlockWatched(0);
            localStorage.setItem("we_watched", "{}");
            localStorage.setItem("we_phase", "watch");
            localStorage.setItem("we_unlock_watched", "0");
            setEarned(null);
            setScreen("unlocked");
          } else {
            setEarned(null);
            setScreen("success");
          }
          return;
        }

        // Pub normale — gain pour l'utilisateur
        try {
          var d = await apiCall("/ads/"+currentAd.id+"/complete","POST",{},token);
          setUser(function(prev) { return Object.assign({}, prev, {balance: d.new_balance}); });
          setHistory(function(prev) { return [{ad_id:currentAd.id, reward:d.reward, created_at:new Date()}, ...prev]; });
          setEarned(d.reward);
        } catch(e) {
          var nb = +((user ? user.balance : 0) + currentAd.reward).toFixed(2);
          setUser(function(prev) { return Object.assign({}, prev, {balance: nb}); });
          setEarned(currentAd.reward);
        }

        // Marquer la pub comme vue + stats cumulatives
        var newWatched = Object.assign({}, watchedAds);
        newWatched[currentAd.id] = true;
        setWatchedAds(newWatched);
        localStorage.setItem("we_watched", JSON.stringify(newWatched));

        var newViews = totalViews + 1;
        var newEarned = +(totalEarned + currentAd.reward).toFixed(2);
        setTotalViews(newViews);
        setTotalEarned(newEarned);
        localStorage.setItem("we_total_views", newViews);
        localStorage.setItem("we_total_earned", newEarned);

        // Vérifier si toutes les 6 pubs ont été vues
        if (Object.keys(newWatched).length >= ADS.length) {
          setPhase("unlock");
          localStorage.setItem("we_phase", "unlock");
        }

        setScreen("success");
      }

      async function handleWithdraw() {
        if (!withdrawEmail || !user || user.balance < 5) return;
        setWLoading(true); setWError("");
        try {
          await apiCall("/withdraw","POST",{paypal_email:withdrawEmail},token);
          setUser(function(prev) { return Object.assign({}, prev, {balance: 0}); });
          setWithdrawDone(true);
        } catch(e) { setWError(e.message); }
        finally { setWLoading(false); }
      }

      if (!user) return <AuthScreen onLogin={handleLogin} />;
      var balance = user ? (user.balance || 0) : 0;
      var allWatched = Object.keys(watchedAds).length >= ADS.length;

      // Médaille dynamique
      function getMedal() {
        if (totalViews >= 500) return { icon:"🥇", label:"Or", color:"#FFD700" };
        if (totalViews >= 100) return { icon:"🥈", label:"Silver", color:"#C0C0C0" };
        return { icon:"🥉", label:"Bronze", color:"#CD7F32" };
      }
      var medal = getMedal();

      return (
        <div style={{minHeight:"100vh",background:"#0A0A0F",color:"#F0F0F0",fontFamily:"'Syne',sans-serif",display:"flex",flexDirection:"column",maxWidth:420,margin:"0 auto"}}>

          {/* HEADER */}
          <header style={{padding:"14px 20px",borderBottom:"1px solid #1A1A2A",display:"flex",alignItems:"center",justifyContent:"space-between",position:"sticky",top:0,zIndex:10,background:"#0A0A0Fdd",backdropFilter:"blur(12px)"}}>
            <div style={{display:"flex",alignItems:"center",gap:10}}>
              <div style={{width:32,height:32,borderRadius:9,background:"linear-gradient(135deg,#00E5A0,#00B4D8)",display:"flex",alignItems:"center",justifyContent:"center",fontSize:15}}>▶</div>
              <div>
                <div style={{fontSize:15,fontWeight:800,lineHeight:1}}>WatchEarn</div>
                <div style={{fontSize:10,color:"#ffffff40"}}>Bonjour {user.name} 👋</div>
              </div>
            </div>
            <div style={{display:"flex",gap:8,alignItems:"center"}}>
              <div style={{background:"#111120",border:"1px solid #00E5A030",borderRadius:9,padding:"5px 11px",animation:"glow 3s ease infinite"}}>
                <span style={{fontSize:13,color:"#00E5A0",fontFamily:"'DM Mono',monospace",fontWeight:500}}>💰 {balance.toFixed(2)} €</span>
              </div>
              <button onClick={handleLogout} style={{background:"#1A1A2A",border:"none",borderRadius:8,padding:"5px 9px",color:"#ffffff50",fontSize:13,cursor:"pointer"}}>⎋</button>
            </div>
          </header>

          {/* WATCHING */}
          {screen==="watching" && currentAd && (
            <div style={{position:"fixed",inset:0,zIndex:100,background:"#050508",display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",padding:32,animation:"slideUp 0.3s ease"}}>
              <div style={{width:250,height:250,borderRadius:30,background:"radial-gradient(circle at 30% 30%,"+currentAd.color+"40,"+currentAd.color+"10)",border:"2px solid "+currentAd.color+"50",display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",marginBottom:24,gap:8,boxShadow:"0 0 80px "+currentAd.color+"30"}}>
                <span style={{fontSize:60}}>{currentAd.emoji}</span>
                <span style={{fontSize:20,fontWeight:800,color:"#fff"}}>{currentAd.brand}</span>
                <span style={{fontSize:12,color:"#ffffff70",textAlign:"center"}}>{currentAd.title}</span>
                {isUnlockAd ? (
                  <div style={{background:"#FF990015",border:"1px solid #FF990040",borderRadius:20,padding:"3px 12px",fontSize:11,color:"#FF9900",animation:"pulse 1.5s ease infinite"}}>🔓 VIDÉO DÉBLOCAGE</div>
                ) : (
                  <div style={{background:"#ffffff15",borderRadius:20,padding:"3px 12px",fontSize:11,color:"#fff",animation:"pulse 1.5s ease infinite"}}>● PUB EN COURS</div>
                )}
              </div>
              <div style={{fontFamily:"'DM Mono',monospace",fontSize:44,fontWeight:500,color:"#fff",marginBottom:4}}>{timeLeft}s</div>
              <div style={{fontSize:12,color:"#ffffff50",marginBottom:20}}>
                {isUnlockAd ? "Regardez pour débloquer les pubs" : "Regardez jusqu'à la fin pour gagner"}
              </div>
              {!isUnlockAd && (
                <div style={{background:"#00E5A015",border:"1px solid #00E5A030",borderRadius:12,padding:"9px 22px",fontSize:18,fontWeight:700,color:"#00E5A0",marginBottom:24,fontFamily:"'DM Mono',monospace"}}>+{currentAd.reward.toFixed(2)} €</div>
              )}
              {isUnlockAd && (
                <div style={{background:"#FF990015",border:"1px solid #FF990030",borderRadius:12,padding:"9px 22px",fontSize:14,color:"#FF9900",marginBottom:24,textAlign:"center"}}>
                  Vidéo {unlockWatched + 1} sur 2
                </div>
              )}
              <div style={{width:"100%",height:5,background:"#1A1A2A",borderRadius:99,overflow:"hidden"}}>
                <div style={{height:"100%",borderRadius:99,width:progress+"%",background:isUnlockAd?"linear-gradient(90deg,#FF9900,#FFD700)":"linear-gradient(90deg,#00E5A0,#00B4D8)",transition:"width 0.9s linear",boxShadow:"0 0 10px "+(isUnlockAd?"#FF990080":"#00E5A080")}}/>
              </div>
            </div>
          )}

          {/* SUCCESS */}
          {screen==="success" && (
            <div style={{position:"fixed",inset:0,zIndex:100,background:"#050508",display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",padding:32,animation:"slideUp 0.3s ease"}}>
              {!isUnlockAd ? (
                <>
                  <div style={{fontSize:68,marginBottom:18,animation:"coinPop 0.6s ease"}}>🎉</div>
                  <div style={{fontSize:24,fontWeight:800,marginBottom:4}}>Bravo !</div>
                  <div style={{fontSize:13,color:"#ffffff60",marginBottom:24,textAlign:"center"}}>Pub {currentAd ? currentAd.brand : ""} regardée !</div>
                  <div style={{fontSize:44,fontWeight:800,color:"#00E5A0",fontFamily:"'DM Mono',monospace",animation:"coinPop 0.6s ease 0.2s both"}}>+{earned ? earned.toFixed(2) : "0.00"} €</div>
                  <div style={{fontSize:12,color:"#ffffff40",marginTop:5,marginBottom:12}}>Nouveau solde : {balance.toFixed(2)} €</div>
                  {allWatched ? (
                    <div style={{background:"#FF990015",border:"1px solid #FF990040",borderRadius:14,padding:"12px 20px",marginBottom:24,textAlign:"center"}}>
                      <div style={{fontSize:13,color:"#FF9900",fontWeight:700}}>🔒 Toutes les pubs vues !</div>
                      <div style={{fontSize:11,color:"#ffffff50",marginTop:4}}>Regardez 2 vidéos pour débloquer le prochain cycle</div>
                    </div>
                  ) : (
                    <div style={{fontSize:12,color:"#ffffff40",marginBottom:24}}>
                      {ADS.length - Object.keys(watchedAds).length} pub(s) restante(s) à regarder
                    </div>
                  )}
                </>
              ) : (
                <>
                  <div style={{fontSize:68,marginBottom:18}}>🔓</div>
                  <div style={{fontSize:24,fontWeight:800,marginBottom:4}}>Vidéo vue !</div>
                  <div style={{fontSize:13,color:"#ffffff60",marginBottom:24,textAlign:"center"}}>
                    {unlockWatched < 2 ? "Encore 1 vidéo pour débloquer !" : "Déblocage en cours..."}
                  </div>
                </>
              )}
              <button className="btn" onClick={function(){setScreen("home");}} style={{background:"linear-gradient(135deg,#00E5A0,#00B4D8)",color:"#000",borderRadius:12,padding:"13px 36px",fontSize:14}}>
                Continuer →
              </button>
            </div>
          )}

          {/* UNLOCKED */}
          {screen==="unlocked" && (
            <div style={{position:"fixed",inset:0,zIndex:100,background:"#050508",display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",padding:32,animation:"slideUp 0.3s ease"}}>
              <div style={{fontSize:80,marginBottom:20,animation:"unlockPop 0.5s ease"}}>🎊</div>
              <div style={{fontSize:28,fontWeight:800,marginBottom:8,color:"#00E5A0"}}>Déblocage !</div>
              <div style={{fontSize:15,color:"#ffffff70",marginBottom:12,textAlign:"center"}}>Les 6 pubs sont à nouveau disponibles !</div>
              <div style={{background:"#00E5A015",border:"1px solid #00E5A030",borderRadius:14,padding:"14px 24px",marginBottom:32,textAlign:"center"}}>
                <div style={{fontSize:13,color:"#00E5A0",fontWeight:700}}>Nouveau cycle démarré 🚀</div>
                <div style={{fontSize:11,color:"#ffffff50",marginTop:4}}>Regardez les 6 pubs pour gagner à nouveau</div>
              </div>
              <button className="btn" onClick={function(){setScreen("home");}} style={{background:"linear-gradient(135deg,#00E5A0,#00B4D8)",color:"#000",borderRadius:12,padding:"13px 36px",fontSize:15}}>
                C'est parti ! →
              </button>
            </div>
          )}

          {/* WITHDRAW */}
          {screen==="withdraw" && (
            <div style={{padding:22,animation:"slideUp 0.3s ease",flex:1,color:"#F0F0F0"}}>
              <button onClick={function(){setScreen("home");setWithdrawDone(false);setWError("");}} style={{background:"none",border:"none",color:"#ffffff60",fontSize:13,cursor:"pointer",marginBottom:18,fontFamily:"'Syne',sans-serif"}}>← Retour</button>
              <div style={{fontSize:22,fontWeight:800,marginBottom:3}}>Retrait PayPal</div>
              <div style={{fontSize:12,color:"#ffffff50",marginBottom:24}}>Min. 5.00 € — Solde : <span style={{color:"#00E5A0"}}>{balance.toFixed(2)} €</span></div>
              {!withdrawDone ? (
                <div>
                  {balance<5 && <div style={{background:"#FF450015",border:"1px solid #FF450040",borderRadius:10,padding:12,marginBottom:16,fontSize:12,color:"#FF9060"}}>⚠️ Il vous manque {(5-balance).toFixed(2)} € pour retirer.</div>}
                  <div style={{marginBottom:12}}>
                    <div style={{fontSize:11,color:"#ffffff60",marginBottom:5}}>Email PayPal</div>
                    <input type="email" placeholder="vous@exemple.com" value={withdrawEmail} onChange={function(e){setWithdrawEmail(e.target.value);}}
                      style={{width:"100%",background:"#111120",border:"1px solid #2A2A3A",borderRadius:11,padding:"12px 15px",color:"#fff",fontSize:14,fontFamily:"'DM Mono',monospace"}}/>
                  </div>
                  <div style={{marginBottom:20}}>
                    <div style={{fontSize:11,color:"#ffffff60",marginBottom:5}}>Montant</div>
                    <div style={{background:"#111120",border:"1px solid #2A2A3A",borderRadius:11,padding:"12px 15px",color:"#00E5A0",fontSize:18,fontFamily:"'DM Mono',monospace",fontWeight:700}}>{balance.toFixed(2)} €</div>
                  </div>
                  {wError && <div style={{background:"#FF450015",border:"1px solid #FF450040",borderRadius:10,padding:11,fontSize:12,color:"#FF9060",marginBottom:14}}>⚠️ {wError}</div>}
                  <button className="btn" onClick={handleWithdraw} disabled={balance<5||!withdrawEmail||wLoading}
                    style={{width:"100%",background:(balance>=5&&withdrawEmail)?"linear-gradient(135deg,#00E5A0,#00B4D8)":"#1A1A2A",color:(balance>=5&&withdrawEmail)?"#000":"#ffffff30",borderRadius:12,padding:14,fontSize:14}}>
                    {wLoading?"Envoi en cours...":"Envoyer via PayPal 💸"}
                  </button>
                </div>
              ) : (
                <div style={{textAlign:"center",animation:"slideUp 0.4s ease"}}>
                  <div style={{fontSize:52,marginBottom:12}}>✅</div>
                  <div style={{fontSize:19,fontWeight:800,marginBottom:6}}>Demande envoyée !</div>
                  <div style={{fontSize:12,color:"#ffffff50",lineHeight:1.8}}>{balance.toFixed(2)} € seront virés sur<br/><span style={{color:"#00E5A0"}}>{withdrawEmail}</span><br/>sous 24–48h ouvrées.</div>
                </div>
              )}
            </div>
          )}

          {/* HOME */}
          {screen==="home" && (
            <div style={{flex:1,overflowY:"auto",paddingBottom:90}}>
              <div style={{padding:"14px 20px 0"}}>
                {/* Balance */}
                <div style={{background:"linear-gradient(135deg,#111120,#0D1A2A)",border:"1px solid #00E5A025",borderRadius:20,padding:20,marginBottom:8,position:"relative",overflow:"hidden"}}>
                  <div style={{position:"absolute",top:-40,right:-40,width:120,height:120,background:"radial-gradient(circle,#00E5A015,transparent)",borderRadius:"50%"}}/>
                  <div style={{fontSize:11,color:"#ffffff50",marginBottom:3,letterSpacing:"0.1em"}}>SOLDE DISPONIBLE</div>
                  <div style={{fontSize:38,fontWeight:800,fontFamily:"'DM Mono',monospace",background:"linear-gradient(135deg,#00E5A0,#00B4D8)",WebkitBackgroundClip:"text",WebkitTextFillColor:"transparent",marginBottom:12}}>{balance.toFixed(2)} €</div>
                  <button className="btn" onClick={function(){setScreen("withdraw");}}
                    style={{background:balance>=5?"linear-gradient(135deg,#00E5A0,#00B4D8)":"#1A1A2A",color:balance>=5?"#000":"#ffffff40",borderRadius:9,padding:"9px 18px",fontSize:12}}>
                    {balance>=5?"💸 Retirer via PayPal":"🔒 Encore "+(5-balance).toFixed(2)+" € pour retirer"}
                  </button>
                </div>

                {/* Stats */}
                <div style={{display:"flex",gap:6,marginBottom:18,marginTop:6}}>
                  {[
                    {label:"Pubs vues",value:totalViews,icon:"👁"},
                    {label:"Total gagné",value:totalEarned.toFixed(2)+"€",icon:"📈"},
                    {label:medal.label,value:medal.icon,icon:null,color:medal.color},
                  ].map(function(s) {
                    return (
                      <div key={s.label} style={{flex:1,background:"#111120",border:"1px solid "+(s.color?"#"+s.color.slice(1)+"30":"#1A1A2A"),borderRadius:11,padding:"9px 5px",textAlign:"center"}}>
                        {s.icon && <div style={{fontSize:15,marginBottom:2}}>{s.icon}</div>}
                        <div style={{fontSize:s.icon?12:22,fontWeight:700,fontFamily:"'DM Mono',monospace",color:s.color||"#fff"}}>{s.value}</div>
                        <div style={{fontSize:9,color:s.color||"#ffffff40",marginTop:1}}>{s.label}</div>
                        {s.label==="Bronze" && <div style={{fontSize:8,color:"#CD7F3280",marginTop:2}}>0-100 vues</div>}
                        {s.label==="Silver" && <div style={{fontSize:8,color:"#C0C0C080",marginTop:2}}>100-500 vues</div>}
                        {s.label==="Or" && <div style={{fontSize:8,color:"#FFD70080",marginTop:2}}>500+ vues</div>}
                      </div>
                    );
                  })}
                </div>
              </div>

              {/* Progression du cycle */}
              <div style={{padding:"0 20px 14px"}}>
                <div style={{background:"#111120",border:"1px solid #1A1A2A",borderRadius:14,padding:"12px 16px"}}>
                  <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:8}}>
                    <div style={{fontSize:12,fontWeight:700,color:"#fff"}}>
                      {phase==="unlock" ? "🔒 Débloquer le prochain cycle" : "📺 Cycle en cours"}
                    </div>
                    <div style={{fontSize:11,color:"#00E5A0",fontFamily:"'DM Mono',monospace"}}>
                      {phase==="unlock" ? unlockWatched+"/2 vidéos" : Object.keys(watchedAds).length+"/"+ADS.length+" pubs"}
                    </div>
                  </div>
                  <div style={{height:6,background:"#1A1A2A",borderRadius:99,overflow:"hidden"}}>
                    <div style={{height:"100%",borderRadius:99,
                      width:(phase==="unlock" ? (unlockWatched/2*100) : (Object.keys(watchedAds).length/ADS.length*100))+"%",
                      background:phase==="unlock"?"linear-gradient(90deg,#FF9900,#FFD700)":"linear-gradient(90deg,#00E5A0,#00B4D8)",
                      transition:"width 0.5s ease"}}/>
                  </div>
                </div>
              </div>

              {/* Pubs normales */}
              {phase === "watch" && (
                <div style={{padding:"0 20px"}}>
                  <div style={{fontSize:15,fontWeight:700,marginBottom:12,display:"flex",alignItems:"center",gap:8}}>
                    <span>Pubs disponibles</span>
                    <span style={{background:"#00E5A020",color:"#00E5A0",fontSize:10,borderRadius:99,padding:"2px 9px"}}>
                      {ADS.length - Object.keys(watchedAds).length} restantes
                    </span>
                  </div>
                  <div style={{display:"flex",flexDirection:"column",gap:9}}>
                    {ADS.map(function(ad) {
                      var isWatched = watchedAds[ad.id];
                      return (
                        <div key={ad.id} style={{background:"#111120",border:"1px solid "+(isWatched?"#00E5A030":"#1A1A2A"),borderRadius:16,padding:13,display:"flex",alignItems:"center",gap:11,opacity:isWatched?0.6:1}}>
                          <div style={{width:46,height:46,borderRadius:11,background:ad.color+"20",border:"1px solid "+ad.color+"40",display:"flex",alignItems:"center",justifyContent:"center",fontSize:22,flexShrink:0,position:"relative"}}>
                            {ad.emoji}
                            {isWatched && (
                              <div style={{position:"absolute",inset:0,background:"#00000080",borderRadius:11,display:"flex",alignItems:"center",justifyContent:"center",fontSize:18}}>✅</div>
                            )}
                          </div>
                          <div style={{flex:1}}>
                            <div style={{fontSize:14,fontWeight:700}}>{ad.brand}</div>
                            <div style={{fontSize:11,color:"#ffffff50",marginTop:1}}>{ad.title}</div>
                            <span style={{fontSize:9,background:"#1A1A2A",borderRadius:99,padding:"2px 7px",color:"#ffffff50",marginTop:4,display:"inline-block"}}>⏱ {ad.duration}s</span>
                          </div>
                          <div style={{textAlign:"right",flexShrink:0}}>
                            <div style={{fontSize:15,fontWeight:800,color:isWatched?"#ffffff30":"#00E5A0",fontFamily:"'DM Mono',monospace"}}>+{ad.reward.toFixed(2)}€</div>
                            {isWatched ? (
                              <div style={{marginTop:4,background:"#00E5A020",borderRadius:7,padding:"5px 11px",fontSize:11,color:"#00E5A0",fontWeight:700,textAlign:"center"}}>✅ Vu</div>
                            ) : (
                              <button className="btn" onClick={function(){watchAd(ad, false);}}
                                style={{marginTop:4,background:"linear-gradient(135deg,"+ad.color+","+ad.color+"bb)",color:"#fff",borderRadius:7,padding:"5px 11px",fontSize:11}}>▶ Voir</button>
                            )}
                          </div>
                        </div>
                      );
                    })}
                  </div>
                </div>
              )}

              {/* Phase de déblocage */}
              {phase === "unlock" && (
                <div style={{padding:"0 20px"}}>
                  <div style={{background:"linear-gradient(135deg,#1A1200,#2A1800)",border:"1px solid #FF990030",borderRadius:18,padding:20,marginBottom:16,textAlign:"center"}}>
                    <div style={{fontSize:36,marginBottom:8}}>🔒</div>
                    <div style={{fontSize:16,fontWeight:800,color:"#FF9900",marginBottom:6}}>Cycle complété !</div>
                    <div style={{fontSize:13,color:"#ffffff70",lineHeight:1.6,marginBottom:16}}>
                      Vous avez regardé les 6 pubs.<br/>
                      Regardez <strong style={{color:"#FF9900"}}>2 vidéos gratuites</strong> pour débloquer le prochain cycle.
                    </div>
                    <div style={{display:"flex",gap:8,justifyContent:"center",marginBottom:4}}>
                      {[0,1].map(function(i) {
                        return (
                          <div key={i} style={{width:40,height:40,borderRadius:99,background:unlockWatched>i?"#FF990030":"#1A1A2A",border:"2px solid "+(unlockWatched>i?"#FF9900":"#2A2A3A"),display:"flex",alignItems:"center",justifyContent:"center",fontSize:18}}>
                            {unlockWatched>i?"✅":"👁"}
                          </div>
                        );
                      })}
                    </div>
                  </div>

                  <div style={{fontSize:14,fontWeight:700,marginBottom:10,color:"#FF9900"}}>Vidéos de déblocage</div>
                  <div style={{display:"flex",flexDirection:"column",gap:9}}>
                    {UNLOCK_ADS.map(function(ad, idx) {
                      var isWatchedUnlock = unlockWatched > idx;
                      return (
                        <div key={ad.id} style={{background:"#111120",border:"1px solid "+(isWatchedUnlock?"#FF990030":"#2A2A1A"),borderRadius:16,padding:13,display:"flex",alignItems:"center",gap:11,opacity:isWatchedUnlock?0.6:1}}>
                          <div style={{width:46,height:46,borderRadius:11,background:ad.color+"20",border:"1px solid "+ad.color+"40",display:"flex",alignItems:"center",justifyContent:"center",fontSize:22,flexShrink:0,position:"relative"}}>
                            {ad.emoji}
                            {isWatchedUnlock && (
                              <div style={{position:"absolute",inset:0,background:"#00000080",borderRadius:11,display:"flex",alignItems:"center",justifyContent:"center",fontSize:18}}>✅</div>
                            )}
                          </div>
                          <div style={{flex:1}}>
                            <div style={{fontSize:14,fontWeight:700}}>{ad.brand}</div>
                            <div style={{fontSize:11,color:"#ffffff50",marginTop:1}}>{ad.title}</div>
                            <span style={{fontSize:9,background:"#1A1A2A",borderRadius:99,padding:"2px 7px",color:"#ffffff50",marginTop:4,display:"inline-block"}}>⏱ {ad.duration}s</span>
                          </div>
                          <div style={{textAlign:"right",flexShrink:0}}>
                            <div style={{fontSize:11,color:"#FF9900",marginBottom:4,fontWeight:600}}>Déblocage</div>
                            {isWatchedUnlock ? (
                              <div style={{background:"#FF990020",borderRadius:7,padding:"5px 11px",fontSize:11,color:"#FF9900",fontWeight:700}}>✅ Vu</div>
                            ) : (
                              <button className="btn" onClick={function(){watchAd(ad, true);}}
                                style={{background:"linear-gradient(135deg,#FF9900,#FFD700)",color:"#000",borderRadius:7,padding:"5px 11px",fontSize:11}}>▶ Débloquer</button>
                            )}
                          </div>
                        </div>
                      );
                    })}
                  </div>
                </div>
              )}

              {/* AdSense */}
              <div style={{padding:"14px 20px",textAlign:"center"}}>
                <div style={{fontSize:9,color:"#ffffff15",marginBottom:3}}>PUBLICITÉ</div>
                <ins className="adsbygoogle" style={{display:"block"}} data-ad-client="ca-pub-6405779707135951" data-ad-slot="auto" data-ad-format="auto" data-full-width-responsive="true"/>
              </div>

              {/* Historique */}
              {history.length > 0 && (
                <div style={{padding:"4px 20px 0"}}>
                  <div style={{fontSize:15,fontWeight:700,marginBottom:10}}>📋 Historique</div>
                  <div style={{display:"flex",flexDirection:"column",gap:7}}>
                    {history.slice(0,5).map(function(h,i) {
                      return (
                        <div key={i} style={{display:"flex",alignItems:"center",justifyContent:"space-between",padding:"9px 13px",background:"#111120",border:"1px solid #1A1A2A",borderRadius:11}}>
                          <div>
                            <div style={{fontSize:12,fontWeight:600}}>Pub regardée</div>
                            <div style={{fontSize:10,color:"#ffffff40"}}>{new Date(h.created_at).toLocaleDateString("fr-FR")}</div>
                          </div>
                          <div style={{fontSize:13,fontWeight:700,color:"#00E5A0",fontFamily:"'DM Mono',monospace"}}>+{(h.reward||0).toFixed(2)} €</div>
                        </div>
                      );
                    })}
                  </div>
                </div>
              )}

              {/* FAQ */}
              <div style={{padding:"20px 20px 0"}}>
                <div style={{fontSize:15,fontWeight:700,marginBottom:12}}>❓ Questions fréquentes</div>
                {FAQ_DATA.map(function(item,i) {
                  return <FaqItem key={i} q={item.q} a={item.a} />;
                })}
              </div>

              {/* Liens */}
              <div style={{padding:"16px 20px 0",display:"flex",gap:8,flexWrap:"wrap"}}>
                <a href="/blog.html" style={{background:"#111120",border:"1px solid #1A1A2A",borderRadius:10,padding:"8px 14px",fontSize:12,color:"#ffffff60",textDecoration:"none",fontWeight:600}}>📖 Blog</a>
                <a href="/about.html" style={{background:"#111120",border:"1px solid #1A1A2A",borderRadius:10,padding:"8px 14px",fontSize:12,color:"#ffffff60",textDecoration:"none",fontWeight:600}}>ℹ️ À propos</a>
                <a href="/privacy.html" style={{background:"#111120",border:"1px solid #1A1A2A",borderRadius:10,padding:"8px 14px",fontSize:12,color:"#ffffff60",textDecoration:"none",fontWeight:600}}>🔒 Confidentialité</a>
              </div>
            </div>
          )}

          {/* Bottom Nav */}
          {(screen==="home") && (
            <div style={{position:"fixed",bottom:0,left:"50%",transform:"translateX(-50%)",width:"100%",maxWidth:420,background:"#0A0A0Fee",backdropFilter:"blur(12px)",borderTop:"1px solid #1A1A2A",padding:"10px 20px",display:"flex",justifyContent:"space-around",zIndex:20}}>
              <button className="nav-btn" onClick={function(){}}>
                <span style={{fontSize:20}}>🏠</span>
                <span style={{fontSize:9,color:"#00E5A0"}}>Accueil</span>
              </button>
              <button className="nav-btn" onClick={function(){window.location.href="/blog.html";}}>
                <span style={{fontSize:20}}>📖</span>
                <span style={{fontSize:9,color:"#ffffff50"}}>Blog</span>
              </button>
              <button className="nav-btn" onClick={function(){window.location.href="/about.html";}}>
                <span style={{fontSize:20}}>ℹ️</span>
                <span style={{fontSize:9,color:"#ffffff50"}}>À propos</span>
              </button>
              <button className="nav-btn" onClick={function(){setScreen("withdraw");}}>
                <span style={{fontSize:20}}>💸</span>
                <span style={{fontSize:9,color:"#ffffff50"}}>Retirer</span>
              </button>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
    setTimeout(function(){ try{(adsbygoogle=window.adsbygoogle||[]).push({});}catch(e){} }, 1500);
  </script>
</body>
</html>
