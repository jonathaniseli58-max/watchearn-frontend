<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WatchEarn — Regardez des pubs, gagnez de l'argent</title>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-6405779707135951" crossorigin="anonymous"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #0A0A0F; font-family: 'Syne', sans-serif; }
    ::-webkit-scrollbar { display: none; }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.5} }
    @keyframes slideUp { from{transform:translateY(30px);opacity:0} to{transform:translateY(0);opacity:1} }
    @keyframes coinPop { 0%{transform:scale(0) rotate(-20deg);opacity:0} 60%{transform:scale(1.3) rotate(5deg)} 100%{transform:scale(1) rotate(0);opacity:1} }
    @keyframes glow { 0%,100%{box-shadow:0 0 20px #00E5A020} 50%{box-shadow:0 0 40px #00E5A060} }
    @keyframes spin { from{transform:rotate(0deg)} to{transform:rotate(360deg)} }
    .ad-card { transition: all 0.25s ease; }
    .ad-card:hover { transform: translateY(-3px); }
    .btn { transition: all 0.2s; cursor: pointer; border: none; font-family: 'Syne', sans-serif; font-weight: 700; }
    .btn:active { transform: scale(0.97); }
    input { outline: none; }
    input:focus { border-color: #00E5A060 !important; }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // 🔧 VOTRE URL RAILWAY
    const API_URL = "https://watchearn-backend.up.railway.app";

    const ADS = [
      { id:"1", brand:"Nike", title:"Just Do It 2026", reward:0.15, duration:30, color:"#FF4500", emoji:"👟" },
      { id:"2", brand:"Spotify", title:"Musique Sans Limite", reward:0.10, duration:20, color:"#1DB954", emoji:"🎵" },
      { id:"3", brand:"Amazon", title:"Deals du Jour", reward:0.20, duration:35, color:"#FF9900", emoji:"📦" },
      { id:"4", brand:"Netflix", title:"Ce Soir Sur Netflix", reward:0.12, duration:25, color:"#E50914", emoji:"🎬" },
      { id:"5", brand:"Apple", title:"iPhone 17 Pro", reward:0.25, duration:40, color:"#A8A8A8", emoji:"📱" },
      { id:"6", brand:"Adidas", title:"Impossible Is Nothing", reward:0.18, duration:30, color:"#444", emoji:"⚽" },
    ];

    async function apiCall(path, method="GET", body=null, token=null) {
      const headers = { "Content-Type": "application/json" };
      if (token) headers["Authorization"] = `Bearer ${token}`;
      try {
        const res = await fetch(`${API_URL}${path}`, { method, headers, body: body ? JSON.stringify(body) : null });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || "Erreur serveur");
        return data;
      } catch(e) {
        throw new Error(e.message || "Impossible de contacter le serveur");
      }
    }

    // ── ÉCRAN CONNEXION / INSCRIPTION ────────────────────────
    function AuthScreen({ onLogin }) {
      const [mode, setMode] = useState("login");
      const [name, setName] = useState("");
      const [email, setEmail] = useState("");
      const [password, setPassword] = useState("");
      const [loading, setLoading] = useState(false);
      const [error, setError] = useState("");

      const handle = async () => {
        if (!email || !password || (mode==="register" && !name)) {
          setError("Veuillez remplir tous les champs"); return;
        }
        setError(""); setLoading(true);
        try {
          const path = mode==="login" ? "/auth/login" : "/auth/register";
          const body = mode==="login" ? {email,password} : {email,password,name};
          const data = await apiCall(path, "POST", body);
          localStorage.setItem("we_token", data.token);
          localStorage.setItem("we_user", JSON.stringify(data.user));
          onLogin(data.user, data.token);
        } catch(e) { setError(e.message); }
        finally { setLoading(false); }
      };

      const inp = (val, set, type="text", ph="") => (
        <input type={type} value={val} onChange={e=>set(e.target.value)} placeholder={ph}
          onKeyDown={e=>e.key==="Enter"&&handle()}
          style={{width:"100%",background:"#0A0A0F",border:"1px solid #2A2A3A",borderRadius:12,padding:"13px 16px",color:"#fff",fontSize:15,fontFamily:type==="email"||type==="password"?"'DM Mono',monospace":"'Syne',sans-serif"}} />
      );

      return (
        <div style={{minHeight:"100vh",background:"#0A0A0F",display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",padding:24,animation:"slideUp 0.4s ease"}}>
          <div style={{display:"flex",alignItems:"center",gap:12,marginBottom:36}}>
            <div style={{width:46,height:46,borderRadius:13,background:"linear-gradient(135deg,#00E5A0,#00B4D8)",display:"flex",alignItems:"center",justifyContent:"center",fontSize:22}}>▶</div>
            <span style={{fontSize:26,fontWeight:800,color:"#fff",letterSpacing:"-0.5px"}}>WatchEarn</span>
          </div>
          <div style={{width:"100%",maxWidth:380,background:"#111120",border:"1px solid #1A1A2A",borderRadius:24,padding:26}}>
            <div style={{fontSize:21,fontWeight:800,color:"#fff",marginBottom:4}}>{mode==="login"?"Connexion":"Créer un compte"}</div>
            <div style={{fontSize:12,color:"#ffffff50",marginBottom:22}}>{mode==="login"?"Accédez à votre solde":"Commencez à gagner de l'argent"}</div>
            {mode==="register" && <div style={{marginBottom:12}}><div style={{fontSize:11,color:"#ffffff60",marginBottom:5}}>Prénom</div>{inp(name,setName,"text","Jonathan")}</div>}
            <div style={{marginBottom:12}}><div style={{fontSize:11,color:"#ffffff60",marginBottom:5}}>Email</div>{inp(email,setEmail,"email","vous@exemple.com")}</div>
            <div style={{marginBottom:18}}><div style={{fontSize:11,color:"#ffffff60",marginBottom:5}}>Mot de passe</div>{inp(password,setPassword,"password","••••••••")}</div>
            {error&&<div style={{background:"#FF450015",border:"1px solid #FF450040",borderRadius:10,padding:"9px 13px",fontSize:12,color:"#FF9060",marginBottom:14}}>⚠️ {error}</div>}
            <button className="btn" onClick={handle} disabled={loading}
              style={{width:"100%",background:"linear-gradient(135deg,#00E5A0,#00B4D8)",color:"#000",borderRadius:12,padding:"14px",fontSize:14,display:"flex",alignItems:"center",justifyContent:"center",gap:8}}>
              {loading ? <span style={{width:16,height:16,border:"2px solid #00000030",borderTopColor:"#000",borderRadius:"50%",animation:"spin 0.8s linear infinite",display:"inline-block"}}/> : mode==="login"?"Se connecter →":"Créer mon compte →"}
            </button>
            <div style={{textAlign:"center",marginTop:16,fontSize:12,color:"#ffffff40"}}>
              {mode==="login"?"Pas encore de compte ?":"Déjà un compte ?"}
              <span onClick={()=>{setMode(mode==="login"?"register":"login");setError("");}} style={{color:"#00E5A0",cursor:"pointer",marginLeft:5,fontWeight:600}}>
                {mode==="login"?"S'inscrire":"Se connecter"}
              </span>
            </div>
          </div>
          <div style={{marginTop:16,fontSize:10,color:"#ffffff20",textAlign:"center"}}>Données sécurisées et chiffrées 🔒</div>
        </div>
      );
    }

    // ── APPLICATION PRINCIPALE ───────────────────────────────
    function App() {
      const [user, setUser] = useState(null);
      const [token, setToken] = useState(null);
      const [screen, setScreen] = useState("home");
      const [currentAd, setCurrentAd] = useState(null);
      const [progress, setProgress] = useState(0);
      const [timeLeft, setTimeLeft] = useState(0);
      const [history, setHistory] = useState([]);
      const [withdrawEmail, setWithdrawEmail] = useState("");
      const [withdrawDone, setWithdrawDone] = useState(false);
      const [earned, setEarned] = useState(null);
      const [wLoading, setWLoading] = useState(false);
      const [wError, setWError] = useState("");
      const intervalRef = useRef(null);

      useEffect(() => {
        const t = localStorage.getItem("we_token");
        const u = localStorage.getItem("we_user");
        if (t && u) { setToken(t); setUser(JSON.parse(u)); loadHistory(t); }
      }, []);

      const loadHistory = async(t) => {
        try { const d = await apiCall("/me/history","GET",null,t); setHistory(d.slice(0,10)); } catch{}
      };

      const handleLogin = (u,t) => { setUser(u); setToken(t); loadHistory(t); };

      const handleLogout = () => {
        localStorage.removeItem("we_token"); localStorage.removeItem("we_user");
        setUser(null); setToken(null); setHistory([]);
      };

      const watchAd = (ad) => { setCurrentAd(ad); setProgress(0); setTimeLeft(ad.duration); setScreen("watching"); };

      useEffect(() => {
        if (screen==="watching" && currentAd) {
          intervalRef.current = setInterval(() => {
            setProgress(p => {
              const next = p + 100/currentAd.duration;
              if (next >= 100) { clearInterval(intervalRef.current); completeAd(); return 100; }
              return next;
            });
            setTimeLeft(t => Math.max(0, t-1));
          }, 1000);
        }
        return () => clearInterval(intervalRef.current);
      }, [screen, currentAd]);

      const completeAd = async() => {
        try {
          const d = await apiCall(`/ads/${currentAd.id}/complete`,"POST",{},token);
          setUser(prev => ({...prev, balance: d.new_balance}));
          localStorage.setItem("we_user", JSON.stringify({...user, balance: d.new_balance}));
          setHistory(prev => [{ad_id:currentAd.id, reward:d.reward, created_at:new Date()}, ...prev]);
          setEarned(d.reward);
        } catch {
          const nb = +((user?.balance||0) + currentAd.reward).toFixed(2);
          setUser(prev=>({...prev,balance:nb}));
          setEarned(currentAd.reward);
        }
        setScreen("success");
      };

      const handleWithdraw = async() => {
        if (!withdrawEmail || (user?.balance||0)<5) return;
        setWLoading(true); setWError("");
        try {
          await apiCall("/withdraw","POST",{paypal_email:withdrawEmail},token);
          setUser(prev=>({...prev,balance:0}));
          localStorage.setItem("we_user",JSON.stringify({...user,balance:0}));
          setWithdrawDone(true);
        } catch(e) { setWError(e.message); }
        finally { setWLoading(false); }
      };

      if (!user) return <AuthScreen onLogin={handleLogin} />;

      const balance = user?.balance || 0;

      return (
        <div style={{minHeight:"100vh",background:"#0A0A0F",color:"#F0F0F0",fontFamily:"'Syne',sans-serif",display:"flex",flexDirection:"column",maxWidth:420,margin:"0 auto"}}>

          {/* HEADER */}
          <header style={{padding:"14px 20px",borderBottom:"1px solid #1A1A2A",display:"flex",alignItems:"center",justifyContent:"space-between",position:"sticky",top:0,zIndex:10,background:"#0A0A0Fdd",backdropFilter:"blur(12px)"}}>
            <div style={{display:"flex",alignItems:"center",gap:10}}>
              <div style={{width:32,height:32,borderRadius:9,background:"linear-gradient(135deg,#00E5A0,#00B4D8)",display:"flex",alignItems:"center",justifyContent:"center",fontSize:15}}>▶</div>
              <div>
                <div style={{fontSize:15,fontWeight:800,lineHeight:1}}>WatchEarn</div>
                <div style={{fontSize:10,color:"#ffffff40"}}>Bonjour {user.name} 👋</div>
              </div>
            </div>
            <div style={{display:"flex",gap:8,alignItems:"center"}}>
              <div style={{background:"#111120",border:"1px solid #00E5A030",borderRadius:9,padding:"5px 11px",animation:"glow 3s ease infinite"}}>
                <span style={{fontSize:13,color:"#00E5A0",fontFamily:"'DM Mono',monospace",fontWeight:500}}>💰 {balance.toFixed(2)} €</span>
              </div>
              <button onClick={handleLogout} title="Déconnexion"
                style={{background:"#1A1A2A",border:"none",borderRadius:8,padding:"5px 9px",color:"#ffffff50",fontSize:13,cursor:"pointer"}}>⎋</button>
            </div>
          </header>

          {/* WATCHING */}
          {screen==="watching" && currentAd && (
            <div style={{position:"fixed",inset:0,zIndex:100,background:"#050508",display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",padding:32,animation:"slideUp 0.3s ease"}}>
              <div style={{width:250,height:250,borderRadius:30,background:`radial-gradient(circle at 30% 30%,${currentAd.color}40,${currentAd.color}10)`,border:`2px solid ${currentAd.color}50`,display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",marginBottom:24,gap:8,boxShadow:`0 0 80px ${currentAd.color}30`}}>
                <span style={{fontSize:60}}>{currentAd.emoji}</span>
                <span style={{fontSize:20,fontWeight:800,color:"#fff"}}>{currentAd.brand}</span>
                <span style={{fontSize:12,color:"#ffffff70",textAlign:"center"}}>{currentAd.title}</span>
                <div style={{background:"#ffffff15",borderRadius:20,padding:"3px 12px",fontSize:11,color:"#fff",animation:"pulse 1.5s ease infinite"}}>● PUB EN COURS</div>
              </div>
              <div style={{fontFamily:"'DM Mono',monospace",fontSize:44,fontWeight:500,color:"#fff",marginBottom:4}}>{timeLeft}s</div>
              <div style={{fontSize:12,color:"#ffffff50",marginBottom:20}}>Regardez jusqu'à la fin pour gagner</div>
              <div style={{background:"#00E5A015",border:"1px solid #00E5A030",borderRadius:12,padding:"9px 22px",fontSize:18,fontWeight:700,color:"#00E5A0",marginBottom:24,fontFamily:"'DM Mono',monospace"}}>+{currentAd.reward.toFixed(2)} €</div>
              <div style={{width:"100%",height:5,background:"#1A1A2A",borderRadius:99,overflow:"hidden"}}>
                <div style={{height:"100%",borderRadius:99,width:`${progress}%`,background:"linear-gradient(90deg,#00E5A0,#00B4D8)",transition:"width 0.9s linear",boxShadow:"0 0 10px #00E5A080"}}/>
              </div>
            </div>
          )}

          {/* SUCCESS */}
          {screen==="success" && (
            <div style={{position:"fixed",inset:0,zIndex:100,background:"#050508",display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",padding:32,animation:"slideUp 0.3s ease"}}>
              <div style={{fontSize:68,marginBottom:18,animation:"coinPop 0.6s ease"}}>🎉</div>
              <div style={{fontSize:24,fontWeight:800,marginBottom:4}}>Bravo !</div>
              <div style={{fontSize:13,color:"#ffffff60",marginBottom:24,textAlign:"center"}}>Pub {currentAd?.brand} regardée avec succès</div>
              <div style={{fontSize:44,fontWeight:800,color:"#00E5A0",fontFamily:"'DM Mono',monospace",animation:"coinPop 0.6s ease 0.2s both"}}>+{earned?.toFixed(2)} €</div>
              <div style={{fontSize:12,color:"#ffffff40",marginTop:5,marginBottom:32}}>Nouveau solde : {balance.toFixed(2)} €</div>
              <button className="btn" onClick={()=>setScreen("home")} style={{background:"linear-gradient(135deg,#00E5A0,#00B4D8)",color:"#000",borderRadius:12,padding:"13px 36px",fontSize:14}}>
                Continuer à gagner →
              </button>
            </div>
          )}

          {/* WITHDRAW */}
          {screen==="withdraw" && (
            <div style={{padding:22,animation:"slideUp 0.3s ease",flex:1}}>
              <button onClick={()=>{setScreen("home");setWithdrawDone(false);setWError("");}} style={{background:"none",border:"none",color:"#ffffff60",fontSize:13,cursor:"pointer",marginBottom:18,fontFamily:"'Syne',sans-serif"}}>← Retour</button>
              <div style={{fontSize:22,fontWeight:800,marginBottom:3}}>Retrait PayPal</div>
              <div style={{fontSize:12,color:"#ffffff50",marginBottom:24}}>Min. 5.00 € — Solde : <span style={{color:"#00E5A0"}}>{balance.toFixed(2)} €</span></div>
              {!withdrawDone ? (
                <div>
                  {balance<5 && <div style={{background:"#FF450015",border:"1px solid #FF450040",borderRadius:10,padding:12,marginBottom:16,fontSize:12,color:"#FF9060"}}>⚠️ Il vous manque {(5-balance).toFixed(2)} € pour retirer.</div>}
                  <div style={{marginBottom:12}}>
                    <div style={{fontSize:11,color:"#ffffff60",marginBottom:5}}>Email PayPal</div>
                    <input type="email" placeholder="vous@exemple.com" value={withdrawEmail} onChange={e=>setWithdrawEmail(e.target.value)}
                      style={{width:"100%",background:"#111120",border:"1px solid #2A2A3A",borderRadius:11,padding:"12px 15px",color:"#fff",fontSize:14,fontFamily:"'DM Mono',monospace"}}/>
                  </div>
                  <div style={{marginBottom:20}}>
                    <div style={{fontSize:11,color:"#ffffff60",marginBottom:5}}>Montant</div>
                    <div style={{background:"#111120",border:"1px solid #2A2A3A",borderRadius:11,padding:"12px 15px",color:"#00E5A0",fontSize:18,fontFamily:"'DM Mono',monospace",fontWeight:700}}>{balance.toFixed(2)} €</div>
                  </div>
                  {wError&&<div style={{background:"#FF450015",border:"1px solid #FF450040",borderRadius:10,padding:11,fontSize:12,color:"#FF9060",marginBottom:14}}>⚠️ {wError}</div>}
                  <button className="btn" onClick={handleWithdraw} disabled={balance<5||!withdrawEmail||wLoading}
                    style={{width:"100%",background:balance>=5&&withdrawEmail?"linear-gradient(135deg,#00E5A0,#00B4D8)":"#1A1A2A",color:balance>=5&&withdrawEmail?"#000":"#ffffff30",borderRadius:12,padding:14,fontSize:14}}>
                    {wLoading?"Envoi en cours...":"Envoyer via PayPal 💸"}
                  </button>
                </div>
              ) : (
                <div style={{textAlign:"center",animation:"slideUp 0.4s ease"}}>
                  <div style={{fontSize:52,marginBottom:12}}>✅</div>
                  <div style={{fontSize:19,fontWeight:800,marginBottom:6}}>Demande envoyée !</div>
                  <div style={{fontSize:12,color:"#ffffff50",lineHeight:1.8}}>{balance.toFixed(2)} € seront virés sur<br/><span style={{color:"#00E5A0"}}>{withdrawEmail}</span><br/>sous 24–48h ouvrées.</div>
                </div>
              )}
            </div>
          )}

          {/* HOME */}
          {screen==="home" && (
            <div style={{flex:1,overflowY:"auto",paddingBottom:60}}>
              <div style={{padding:"14px 20px 0"}}>
                {/* Balance */}
                <div style={{background:"linear-gradient(135deg,#111120,#0D1A2A)",border:"1px solid #00E5A025",borderRadius:20,padding:20,marginBottom:8,position:"relative",overflow:"hidden"}}>
                  <div style={{position:"absolute",top:-40,right:-40,width:120,height:120,background:"radial-gradient(circle,#00E5A015,transparent)",borderRadius:"50%"}}/>
                  <div style={{fontSize:11,color:"#ffffff50",marginBottom:3,letterSpacing:"0.1em"}}>SOLDE DISPONIBLE</div>
                  <div style={{fontSize:38,fontWeight:800,fontFamily:"'DM Mono',monospace",background:"linear-gradient(135deg,#00E5A0,#00B4D8)",WebkitBackgroundClip:"text",WebkitTextFillColor:"transparent",marginBottom:12}}>{balance.toFixed(2)} €</div>
                  <button className="btn" onClick={()=>setScreen("withdraw")}
                    style={{background:balance>=5?"linear-gradient(135deg,#00E5A0,#00B4D8)":"#1A1A2A",color:balance>=5?"#000":"#ffffff40",borderRadius:9,padding:"9px 18px",fontSize:12}}>
                    {balance>=5?"💸 Retirer via PayPal":`🔒 Encore ${(5-balance).toFixed(2)} € pour retirer`}
                  </button>
                </div>

                {/* Stats */}
                <div style={{display:"flex",gap:6,marginBottom:18,marginTop:6}}>
                  {[
                    {label:"Pubs vues",value:history.length,icon:"👁"},
                    {label:"Total gagné",value:`${(history.reduce((a,b)=>a+(b.reward||0),0)+balance).toFixed(2)}€`,icon:"📈"},
                    {label:"Niveau",value:"Silver",icon:"🥈"},
                  ].map(s=>(
                    <div key={s.label} style={{flex:1,background:"#111120",border:"1px solid #1A1A2A",borderRadius:11,padding:"9px 5px",textAlign:"center"}}>
                      <div style={{fontSize:15,marginBottom:2}}>{s.icon}</div>
                      <div style={{fontSize:12,fontWeight:700,fontFamily:"'DM Mono',monospace"}}>{s.value}</div>
                      <div style={{fontSize:9,color:"#ffffff40",marginTop:1}}>{s.label}</div>
                    </div>
                  ))}
                </div>
              </div>

              {/* Ads list */}
              <div style={{padding:"0 20px"}}>
                <div style={{fontSize:15,fontWeight:700,marginBottom:12,display:"flex",alignItems:"center",gap:8}}>
                  <span>Pubs disponibles</span>
                  <span style={{background:"#00E5A020",color:"#00E5A0",fontSize:10,borderRadius:99,padding:"2px 9px"}}>{ADS.length} aujourd'hui</span>
                </div>
                <div style={{display:"flex",flexDirection:"column",gap:9}}>
                  {ADS.map(ad=>(
                    <div key={ad.id} className="ad-card" style={{background:"#111120",border:"1px solid #1A1A2A",borderRadius:16,padding:13,display:"flex",alignItems:"center",gap:11}}>
                      <div style={{width:46,height:46,borderRadius:11,background:`${ad.color}20`,border:`1px solid ${ad.color}40`,display:"flex",alignItems:"center",justifyContent:"center",fontSize:22,flexShrink:0}}>{ad.emoji}</div>
                      <div style={{flex:1}}>
                        <div style={{fontSize:14,fontWeight:700}}>{ad.brand}</div>
                        <div style={{fontSize:11,color:"#ffffff50",marginTop:1}}>{ad.title}</div>
                        <span style={{fontSize:9,background:"#1A1A2A",borderRadius:99,padding:"2px 7px",color:"#ffffff50",marginTop:4,display:"inline-block"}}>⏱ {ad.duration}s</span>
                      </div>
                      <div style={{textAlign:"right",flexShrink:0}}>
                        <div style={{fontSize:15,fontWeight:800,color:"#00E5A0",fontFamily:"'DM Mono',monospace"}}>+{ad.reward.toFixed(2)}€</div>
                        <button className="btn" onClick={()=>watchAd(ad)}
                          style={{marginTop:4,background:`linear-gradient(135deg,${ad.color},${ad.color}bb)`,color:"#fff",borderRadius:7,padding:"5px 11px",fontSize:11}}>▶ Voir</button>
                      </div>
                    </div>
                  ))}
                </div>
              </div>

              {/* AdSense */}
              <div style={{padding:"14px 20px",textAlign:"center"}}>
                <div style={{fontSize:9,color:"#ffffff15",marginBottom:3}}>PUBLICITÉ</div>
                <ins className="adsbygoogle" style={{display:"block"}} data-ad-client="ca-pub-6405779707135951" data-ad-slot="auto" data-ad-format="auto" data-full-width-responsive="true"/>
              </div>

              {/* History */}
              {history.length>0 && (
                <div style={{padding:"4px 20px 0"}}>
                  <div style={{fontSize:15,fontWeight:700,marginBottom:10}}>Historique</div>
                  <div style={{display:"flex",flexDirection:"column",gap:7}}>
                    {history.slice(0,5).map((h,i)=>(
                      <div key={i} style={{display:"flex",alignItems:"center",justifyContent:"space-between",padding:"9px 13px",background:"#111120",border:"1px solid #1A1A2A",borderRadius:11}}>
                        <div>
                          <div style={{fontSize:12,fontWeight:600}}>Pub regardée</div>
                          <div style={{fontSize:10,color:"#ffffff40"}}>{new Date(h.created_at).toLocaleDateString("fr-FR")}</div>
                        </div>
                        <div style={{fontSize:13,fontWeight:700,color:"#00E5A0",fontFamily:"'DM Mono',monospace"}}>+{(h.reward||0).toFixed(2)} €</div>
                      </div>
                    ))}
                  </div>
                </div>
              )}
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
    setTimeout(()=>{ try{(adsbygoogle=window.adsbygoogle||[]).push({});}catch(e){} },1500);
  </script>
</body>
</html>
